# 140-H, recorder NVR 4 (192.168.67.57) -- 32 channels, all live.
#
# Every channel here is watched. The ac: label does not decide whether a camera
# is used; it decides what that camera's room is allowed to claim:
#
#   visible   the unit is in frame -> "empty, and still running" can be stated
#             outright, so the alert names waste rather than asking anyone to
#             go and look.
#   hidden    the room has a unit the camera cannot see -> the alert can only
#             say the room has been empty a while; somebody walks past and
#             checks the unit.
#   none      there is no unit here at all. The cameras still run and still
#             count people -- that history is worth having -- but the room
#             never raises an air-conditioner alert, because there is nothing
#             in it to switch off.
#   unknown   nobody has said yet. Deliberately not given a default: guessing
#             "none" on a room that does have a unit silently drops it from
#             the thing this system exists to do.
#
# Several cameras can cover one room. A room counts as empty only when every
# one of its cameras agrees it is empty -- one camera seeing a person is enough
# to keep the room occupied, because a person out of one camera's view is still
# a person in the room.
#
# empty_after_minutes is how long a room stays empty before it is worth saying
# anything. Short enough to catch a real lapse, long enough that stepping out
# for a few minutes does not set it off.
#
# stream picks main or sub for one room's cameras, overriding the recorder's
# own setting. It matters more than it sounds: on 7 November nvr1 and nvr4
# handed back 640x360, which is plenty to see that somebody is in a corridor
# and nowhere near enough to read an air conditioner's display -- at that
# size the display is a handful of pixels, and calibrating from it would
# measure noise. So the rooms that can raise a check ask for main and the car
# park does not, which keeps the extra decoding off fifty cameras that do not
# need it.
#
# watch: false leaves a room in this file, with its note, and stops the loop
# spending time on it. The three dead channels on xvr3 cost six seconds each,
# every cycle, to fetch a black frame.
#
# meter says which K-Electric meter pays for this room. There are two at
# 140-H: gf_basement covers the ground floor and the basement and has the
# solar array behind it, and first_cafe covers the first floor and the cafe
# and does not. Without it a room's empty-and-cooled hours cannot be set
# against anything that was actually metered, so the money stays an
# assumption. Left out means nobody has said yet, and the page counts how
# many are still unsaid rather than guessing a floor.
#
# ac_count is how many units are in the room. A room with three units and one
# calibrated is not a calibrated room, and saying so is the difference between
# "the unit is off" and "one of three is off and nobody looked at the other
# two". Left out it means one. It is a count of what is in the room, not of
# what a camera can see: a room with two units where only one is in frame is
# still ac_count: 2, and the page says one of two is read.
#
# Two optional lines deal with a camera that keeps seeing a person who is not
# there -- a poster, a mannequin, a coat on a chair, a reflection in a glass
# door. A room stuck at one person is never counted as empty, so it quietly
# stops being watched for waste, which is why this is worth fixing rather than
# living with.
#
#   ignore:        boxes, per channel, where this camera reliably sees a false
#     10:          person. A detection is dropped only when most of it sits
#       - [x1, y1, x2, y2]   inside the box, so a real person standing in
#                            front of it is bigger, reaches outside it, and
#                            is still counted. On this site the usual cause
#                            is not a poster but a doorway or a pane of
#                            glass: the camera looks straight through into a
#                            corridor and the people it finds are real, just
#                            in a different room. On a room watched by two
#                            recorders, write the key as "xvr3:16".
#   conf: 0.45     a stricter confidence for this room alone. Use it when the
#                  false detections are faint and scattered rather than in one
#                  spot. Prefer a zone: a confidence applies to the whole
#                  room, including the far corner where somebody is half
#                  hidden behind a monitor.
#
# Do not guess either one. Run `python check_room.py --room "<name>"`: it
# draws every detection on a live frame with its score and prints the exact
# lines to paste here.
#
# Nearly every room is a list of channels on one recorder:
#
#   recorder: nvr1
#   channels: [22]
#
# A place two recorders can both see is written out in full instead:
#
#   cameras:
#     - {recorder: nvr1, channel: 22}
#     - {recorder: xvr3, channel: 16}
#
# Use the second form rather than making two rooms. Two rooms means one of
# them can sit there calling itself empty for forty-five minutes while the
# other watches somebody sitting in it -- which is exactly what nvr1 ch22 and
# xvr3 ch16 were doing before they were joined.
#
# Credentials are NOT in this file. They come from .env, which is not committed.

# Numbers the dashboard uses to turn empty cooled-room time into electricity,
# money and carbon. Every one of them is an assumption, not a measurement, and
# they live here rather than inside the code so that anyone who disagrees can
# see what they are disagreeing with and change it in one place.
#
# They answer a conditional question -- IF the units in those empty rooms were
# running, this is what it would amount to -- and the dashboard says so. None
# of it becomes a saving until two things exist that do not exist yet: a
# calibrated unit, so the state is measured rather than supposed, and a record
# of somebody acting on an alert, so the difference is attributable to this
# system rather than to the weather.
# A blurred still per air-conditioned room, so somebody leaving at seven can
# look before they walk. Off by default, and narrow when on: blurred with the
# same pass the alert snapshots use, so faces and screens are gone before the
# file is written; a still, not a stream; only rooms with a unit; overwritten
# each pass rather than accumulated, so no archive of the building builds up;
# and never near the database, which holds counts and nothing else by design.
#
# Pictures are a different kind of data from counts, and the review that set
# this system's handling rules was about counts. Turning this on is worth a
# word with whoever signed that off, and with HR -- not because it is
# dangerous, but because it is a change they should hear about from you rather
# than notice later.
# When the building is in use. A room empty for forty-five minutes at two in
# the afternoon has somebody in a meeting; the same room empty for forty-five
# minutes at eleven at night has nobody coming back. The wait before reporting
# should not be the same number at both, so outside these hours -- evenings,
# nights, and all of Saturday and Sunday -- it drops to the short one.
#
# A room whose own figure is already shorter keeps its own: the off-hours
# number only ever shortens the wait, never lengthens it.
#
# Public holidays are not in here, because nothing knows them. On Eid the
# building will look like a long weekday to this, and report rooms after
# forty-five minutes instead of ten. Worth remembering rather than worth
# guessing at.
hours:
  operations:
    days: [mon, tue, wed, thu, fri]
    start: "10:00"
    end: "20:00"
  off_hours_empty_after_minutes: 10

snapshots:
  enabled: false

assumptions:
  unit_kw: 1.2                 # a split unit while it is actually cooling
  # Where a room's units have their size written down (ac_tons: tons of ONE
  # unit, in the room's entry), each draws ac_tons x kw_per_ton instead of
  # unit_kw. About 1 kW per ton of cooling while the compressor runs is the
  # usual figure for a split or tower unit; an older fixed-speed one draws
  # more (1.2-1.3). Replace with the nameplate when somebody reads it.
  kw_per_ton: 1.0
  # A unit that is "on" does not draw its rated kW every minute: the
  # compressor cycles, more so on a November night. The room-by-room AC
  # ledger (Energy tab, Who comes when) multiplies by this. Checked 12 Nov
  # against the meters: at full rated power the 140-H ledger came to 1,073
  # kWh for 11 Nov -- more than the whole building's 763 on both meters
  # with the solar, lights and computers included. At half, ~540 kWh, about
  # 70% of the building, a usual share for an air-conditioned office. The
  # Energy tab shows that check against the latest readings every day;
  # refit this when a week or two of readings is in.
  ac_duty: 0.5
  # What one more unit actually costs, worked out from the October 2026
  # detailed bill for account 0400006377759 rather than assumed.
  #
  # The all-in average on that bill was Rs 76.33, but an average is the wrong
  # number here. Fixed charges do not change when a room's air conditioner
  # goes off, so the money a switch actually saves is the marginal cost: the
  # variable energy rate, plus the per-unit adders (quarterly adjustment
  # 0.5194, fuel adjustment 1.1086, PHL surcharge 3.23), plus the taxes,
  # which come to 67.1% on top of the electricity charges.
  #
  # And it is not one number, because the tariff is time-of-use. An hour of
  # cooling an empty room in the evening costs 22% more than the same hour in
  # the afternoon, and the evening is exactly when offices empty and units
  # get left on. That is the hour worth walking for.
  tariff_rs_per_kwh: 67          # off-peak, and the default
  peak_rs_per_kwh: 81            # 18:30-22:30
  peak_start: "18:30"
  peak_end: "22:30"
  # Confirm the window against a bill: it is not printed on the summary page,
  # and K-Electric shifts it between summer and winter. 18:30-22:30 is what
  # Shamroze reported and matches the winter window.        # replace with the effective rate off the bill
  co2_kg_per_kwh: 0.45         # grid average; the national figure moves
  co2_kg_per_tree_year: 21     # what one mature tree takes up in a year

# Units in places no camera watches. They are never read and never alerted
# on, but they are on the bill, so the campus totals count them. 140-H's
# survey, Shamroze, 12 Nov: 57 units, 74.5 tons (13 x 2 t, 3 x 1.5 t,
# 2 x 2.5 t, 39 x 1 t; 5 inverter, 52 not) -- basement 6 / 8 t, ground
# floor 22 / 28 t, first floor 22 / 25.5 t, cafe and mosque 7 / 13 t.
unwatched_units:
  - campus: 140-H
    place: Directors' rooms (DR rooms, first floor, 7 rooms)
    # The survey list gives these seven; "one 1.5 ton, the rest 1 ton" was
    # also said, and the list (with a 2 ton Gree) is what makes the first
    # floor add up to 25.5 tons.
    ac_tons: [1, 1, 1, 2, 1.5, 1, 1]
  - campus: 140-H
    place: Data centre (the racks behind Room 13's glass)
    ac_tons: [1, 2]              # Haier 1 ton, Super General 2 ton
  - campus: 140-H
    place: Room 16, guest room (first floor)
    ac_tons: [1]                 # Kenwood
  - campus: 140-H
    place: Director room, ground floor (survey, Green Air 2 t + 1 t inverter)
    # Placed in IT Head Room until 12 Nov, when Shamroze found one 1.5 t
    # unit there: this is another room, and no camera sees it.
    ac_tons: [2, 1]

recorders:
  # ------------------------------------------------------------ 141-C/D
  # Added 11 Nov. Same 192.168.67.x network as 140-H, so the laptop on
  # the camera cable should reach it directly -- ping first to be sure.
  # No rooms yet: the loop only visits a recorder once a room names it,
  # so this line on its own changes nothing until the scan is mapped.
  cd_nvr1:
    campus: 141-C/D
    host: 192.168.67.70
    brand: hikvision     # scan 11 Nov: 32 of 32 live, sub 720x576 / 704x576 / 640x360
    user_env: CD_NVR1_USER
    pass_env: CD_NVR1_PASS
    stream: sub
  cd_nvr2:
    campus: 141-C/D
    host: 192.168.67.168
    brand: hikvision   # scan 11 Nov: 16 of 16 live, sub 640x360, some H.265; mapped the same day
    user_env: CD_NVR2_USER
    pass_env: CD_NVR2_PASS
    stream: sub
  cd_nvr3:
    campus: 141-C/D
    host: 192.168.67.56
    brand: hikvision   # its screen says HVR and Hik-Connect
    user_env: CD_NVR3_USER
    pass_env: CD_NVR3_PASS
    # scan 11 Nov: 16 of 16 live, but the sub stream is only 352x288 --
    # too small to find a seated person across a room. Scan --main next;
    # this likely becomes stream: main.
    stream: sub
  cd_nvr4:
    campus: 141-C/D
    host: 192.168.67.17
    brand: hikvision   # DHCP is ON: the address can change on a reboot -- ask IT to fix it
    user_env: CD_NVR4_USER
    pass_env: CD_NVR4_PASS
    # scan 11 Nov: 10 live in 1-11 (ch 8 empty), 12-15 empty, 16 unchecked
    stream: sub
  cd_xvr2:
    campus: 141-C/D
    host: 192.168.67.59
    brand: xmeye       # white-label XMeye/Xiongmai: Net Card, Media Port 8201, HS Download
    # scan 11 Nov: the older path gave nothing on ch 1-4. The scanner now
    # checks the RTSP port first and tries the newer firmware's path too;
    # once one answers, write that exact one here (xmeye or xmeye-hash):
    # the loop does not guess.
    # 12 Nov, the reason: an IP CONFLICT. XVR 2's own screen says
    # 192.168.67.59, web on 8200, media on 8201 -- but at .59 those ports
    # are shut, and what answers has 80, 554 and 8000 open (a Hikvision
    # pattern) behind its own network card (MAC 50-e5-38-cd-b9-4d). This
    # laptop reaches that other device, never the XVR, so every login
    # "failed". With Shamroze's login (admin, in .env) both path forms gave
    # nothing, one try each; no more until IT moves the XVR to a free
    # address (none answered at .63, .81, .87-.99 on 12 Nov 16:15).
    user_env: CD_XVR2_USER
    pass_env: CD_XVR2_PASS
    stream: sub
  cd_xvr1:
    campus: 141-C/D
    # 12 Nov: its login (from Shamroze) opened 192.168.67.77, one of the
    # two Dahua recorders on the network that were in no list; .78 refused
    # it (one try, not repeated). 16 of 16 channels live, main 960x1080
    # (1080N, widened), sub 352x288 -- too small for people, hence main.
    # No rooms until Shamroze names the channels: scan_192_168_67_77/.
    host: 192.168.67.77
    brand: dahua
    user_env: CD_XVR1_USER
    pass_env: CD_XVR1_PASS
    stream: main
  cd_xvr3:
    campus: 141-C/D
    # 12 Nov: its login (from Shamroze) opened 192.168.67.78 at the first
    # try -- the second Dahua recorder in no list; same network-card make
    # as XVR 1. 15 of 16 channels live (ch 12 black), main 960x1080. No
    # rooms until the channels are named: scan_192_168_67_78/.
    host: 192.168.67.78
    brand: dahua
    user_env: CD_XVR3_USER
    pass_env: CD_XVR3_PASS
    stream: main
  # Still to come: XVR4 (Dahua; address unknown), and the DVR, which is on its
  # Hikvision factory address 192.168.1.64 with DHCP on and no lease:
  # a different network from everything else here, so unreachable until
  # IT gives it a fixed 192.168.67.x address.

  nvr4:
    campus: 140-H
    host: 192.168.67.57
    brand: hikvision     # decides the RTSP path; confirmed by scanning
    user_env: NVR4_USER
    pass_env: NVR4_PASS
    stream: sub          # 640x360, enough to find people
    note: >
      Covers the cafe, the basement, the solar array and the utility yards.
      Worth being plain about what this recorder is for: of its seventeen
      rooms, two have a unit in frame and two have one out of frame. The other
      thirteen have no air conditioner at all. So the saving here is small, and
      what this recorder mostly produces is occupancy -- which room is used,
      and until what time. The offices at 140-H, where the units actually run
      late, are on DVR 2.

  dvr2:
    campus: 140-H
    host: 192.168.67.74
    brand: dahua         # confirmed: the Hikvision path answers 404 here
    user_env: DVR2_USER
    pass_env: DVR2_PASS
    stream: main         # the sub stream is 352x288, too small to work with
    channels: 16
    dhcp_warning: true
    note: >
      Sixteen channels, and the offices are on this one. Three things about it
      differ from NVR 4 and all three matter.

      Most channels come back 960x1080. That is 1080N: the recorder keeps half
      the horizontal detail and stretches it back on playback, so the picture
      arrives squashed sideways. Fed in as-is, a standing person is a tall thin
      column and the detector is being shown a shape it was never trained on.
      These frames need widening to 1920x1080 before anything looks at them.

      The sizes are not uniform -- channel 8 is 960x576, channels 11 and 12 are
      1280x720 and need no correction. So the widening has to be decided per
      frame from its own dimensions, not once per recorder.

      Its address is handed out by DHCP, so it is borrowed, not owned. Ask for
      a reservation on fc:b6:9d:72:8f:48, or the system goes quiet one morning
      for a reason nobody will think to look for.

  nvr1:
    campus: 140-H
    host: 192.168.67.80
    brand: hikvision     # found by scanning, not assumed from the MAC
    channels: 32
    user_env: NVR1_USER
    pass_env: NVR1_PASS
    stream: sub          # revisit once a scan shows what the sub stream is
    note: >
      Not surveyed yet, and the brand is left out on purpose -- the scanner
      finds it from whichever path answers.

      Its address is static, not handed out by DHCP like DVR 2 and XVR 3, so
      this one will not change underneath us and needs no reservation.

      Its MAC begins 08:a1:89 where the other recorders begin fc:b6:9d, a
      different manufacturer, and it turned out to be a Hikvision all the
      same. Which is the point of asking rather than inferring: the MAC said
      "different maker" and the maker was the same, while DVR 2's neighbour
      said "Hikvision" and it was a Dahua. Neither hint was any good.
    rooms_pending: true

  xvr3:
    campus: 140-H
    host: 192.168.67.23
    brand: dahua         # found by scanning
    channels: 16
    user_env: XVR3_USER
    pass_env: XVR3_PASS
    stream: main         # the sub stream is 352x288, same as DVR 2
    dhcp_warning: true
    note: >
      A Dahua, like DVR 2, and with the same catch: its sub stream is 352x288,
      which is too small to find people reliably and far too small to read an
      indicator light. It reads the main stream instead.

      Its address is handed out by DHCP, like DVR 2's. Ask for a reservation
      on fc:b6:9d:72:8e:08 or this one goes quiet one morning too.
    rooms_pending: true

rooms:

  # ===========================================================================
  # DVR 2 -- the offices. Thirteen of its sixteen cameras have a unit in frame.
  # ===========================================================================

  # ---- never alerted on, whatever the cameras see ---------------------------
  #
  # These two are cooled around the clock on purpose, and the cooling is not
  # waste: it is what keeps the equipment alive. They are empty of people
  # almost all the time, so on occupancy alone they would be the loudest
  # rooms in the building -- every night, every weekend, "empty for hours and
  # still running".
  #
  # That alarm would be wrong in the one direction that actually costs money.
  # Everything else here risks a wasted walk down a corridor; acting on this
  # one risks a server room with its cooling switched off. Alerting and
  # trusting people to ignore it is not a safeguard, because an alert that is
  # correct to ignore teaches everyone to ignore the rest as well.
  #
  # So they are watched -- the occupancy history is worth having, and a person
  # in the data centre at 3am is worth knowing about -- and they never alert.

  - name: UPS Room
    floor: Ground floor
    zone: Server rooms
    recorder: dvr2
    channels: [5]
    ac: visible
    ac_tons: [1]   # survey 12 Nov: UPS room, 1 ton Haier
    alert: never
    empty_after_minutes: null
    # Through the doorway at the back is somebody else's desk, and the person
    # sitting at it was counted as being in the UPS room on 7 November, at
    # 0.37. This room never alerts, so it costs no false trip -- but it still
    # reports a server room as occupied all day on the dashboard, which is
    # simply untrue.
    #
    # Estimated from one frame: CHECK IT with check_room.py before trusting.
    ignore:
      5:
        - [685, 90, 940, 530]      # through the doorway, the next room
    note: >
      Battery life falls off sharply with temperature. Cooling here is not
      discretionary.

  - name: Data Centre Operations
    floor: First floor
    zone: Server rooms
    recorder: dvr2
    channels: [6]
    ac: visible
    ac_tons: [1, 1]   # survey 12 Nov: Room 13, 1 ton TCL inverter + 1 ton Kenwood
    alert: never
    empty_after_minutes: null

  # ---- offices: unit in frame -----------------------------------------------

  - name: DL Department
    floor: Basement
    dept: Disrupt Labs
    # Basement, disrupt labs. Told by Shamroze, 10 November.
    meter: gf_basement
    zone: Offices
    recorder: dvr2
    channels: [1]
    # 7 Nov: no unit in any of this room's frames, read at full width
    # across the upper part of the picture, where a split unit is
    # mounted. It was labelled visible from the survey contact sheet,
    # where a wall unit is a few pixels across. docs/camera_survey.md.
    ac: hidden
    ac_tons: [1]   # survey 12 Nov: the basement's fourth Haier 1 ton
    empty_after_minutes: 45
    # 12 Nov 00:15 night check: two empty chairs in the dark read as people
    # at 0.28 and 0.29, and the room flickered occupied/empty all night
    # (the "first in 2:43 night" of 11 Nov). Chairs are seats, so no zone:
    # a stricter bar at night only. People here at night score 0.7+.
    # 02:15 round: still flickering, now on one chair at 0.47-0.49 (01:43,
    # 02:26); a real person at 01:04 scored 0.79-0.85. Raised to 0.55.
    conf_after_hours: 0.55

  - name: HR Room
    floor: Ground floor
    zone: Offices
    recorder: dvr2
    channels: [2]
    # 10 Nov, 20:32, from check_room --all: every box below was looked
    # at by eye and is a fixed object, not a person. Zones were only
    # written where nobody sits and nobody walks through; chairs and
    # benches were left alone on purpose, because a zone on a chair
    # also hides the person sitting in it.
    ignore:
      2:
        - [1390, 21, 1425, 122]  # door frame beyond the glass, 0.25
    # 7 Nov: no unit in any of this room's frames, read at full width
    # across the upper part of the picture, where a split unit is
    # mounted. It was labelled visible from the survey contact sheet,
    # where a wall unit is a few pixels across. docs/camera_survey.md.
    ac: hidden
    ac_tons: [2]   # survey 12 Nov: placed as Room 7, Dawlance 2 ton (check)
    empty_after_minutes: 45

  - name: Marketing
    floor: Ground floor
    zone: Offices
    recorder: dvr2
    channels: [3, 13]
    # 7 Nov: the unit is on ch13, above the green door, top right. ch3
    # sees none of it. Calibrate on ch13. docs/camera_survey.md.
    # 10 Nov: five units in this room, not one -- counted on site while the
    # technician was switching them. Any one of them running means the room
    # is being cooled, so the state is honest as soon as one is calibrated;
    # what is not honest until all five are is the money, which assumes a
    # room's worth of cooling from whichever units have been measured.
    ac: visible
    ac_tons: [1, 1, 1, 1, 1]   # survey 12 Nov: Room 8 (several depts), Kenwood x3 + TCL x2, 1 ton
    empty_after_minutes: 45
    note: >
      Two cameras, written down as "marketingroom" and "marketing". Grouped on
      the assumption they are one room, and that way round on purpose: if two
      cameras really do watch one room and are treated as two, then one of them
      seeing an empty half of the room raises "empty, and still running" while
      somebody is sitting in the other half. Grouping two separate rooms by
      mistake only costs a missed alert. Worth confirming, but the cost of
      being wrong is not symmetric.

  - name: Creative Room
    floor: Ground floor
    # Ground floor. Told by Shamroze, 10 November.
    meter: gf_basement
    zone: Offices
    recorder: dvr2
    channels: [4]
    # 11 Nov, morning: empty, yet counted at 0.25-0.35 on a different chair
    # each time round the centre desk. A zone there would blind the desk
    # people work at, so the confidence went up to 0.40 -- and at 17:10
    # the same day field_audit found six people at those desks, under the
    # purple light, and not one scoring 0.40: the room read 0 to 2. So the
    # high bar is for when nobody should be here, and working hours use
    # the normal one.
    conf_after_hours: 0.40
    # 7 Nov: no unit in any of this room's frames, read at full width
    # across the upper part of the picture, where a split unit is
    # mounted. It was labelled visible from the survey contact sheet,
    # where a wall unit is a few pixels across. docs/camera_survey.md.
    ac: hidden
    ac_tons: [1, 1]   # survey 12 Nov: Room 5, 2 x 1 ton (Kenwood)
    empty_after_minutes: 45
    # The camera looks straight through a glass door into the corridor. On
    # 7 November the room itself was empty -- every chair pushed in -- while
    # two people walking past outside were counted at 0.80 and 0.83. They
    # are real people; they are just not in this room, and counting them
    # keeps the room permanently occupied and so permanently unwatched.
    #
    # Estimated from one frame: CHECK IT with check_room.py, which draws the
    # zone in grey, before trusting it.
    ignore:
      4:
        - [1425, 100, 1690, 790]   # corridor beyond the glass door

  - name: Admin Room
    floor: Ground floor
    # Ground floor. Told by Shamroze, 10 November.
    meter: gf_basement
    zone: Offices
    recorder: dvr2
    channels: [9]
    ac: visible
    ac_tons: [1]   # survey 12 Nov: Admin room, 1 ton Kenwood
    empty_after_minutes: 45

  - name: AutoOS
    floor: Ground floor
    # Ground floor. Told by Shamroze, 10 November.
    meter: gf_basement
    zone: Offices
    recorder: dvr2
    channels: [10, 14]
    # 11 Nov, from the evidence pack (09:15-09:59, rooms empty): a box
    # in the same place in every picture, looked at by eye, and in a
    # spot nobody sits in or walks through.
