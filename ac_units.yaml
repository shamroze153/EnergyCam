# Calibrated air-conditioner detection, one block per room.
#
# Kept apart from rooms.yaml on purpose. That file says which camera watches
# which room and is edited by whoever walks the building; this one holds
# measurements taken from two photographs and is edited by whoever did the
# measuring. Mixing them would mean a survey and a calibration arguing over
# the same lines.
#
# How a unit is read: the box is placed over the unit's own display, and the
# contrast inside it is measured. A lit display has bright strokes on a dark
# face and so has high contrast; an unlit one is a flat panel and has almost
# none. The threshold sits between the two measured values.
#
# Nothing is written here that was not measured. Every block carries the two
# numbers it came from and when they were taken, so a threshold that starts
# misbehaving can be compared against the day it was set rather than argued
# about.

rooms:

  Admin Room:
    recorder: dvr2
    channel: 9
    # This camera was infrared at a quarter past twelve in the afternoon --
    # the colour channels were identical, which is how infrared looks. So it
    # is calibrated in infrared. It does come back in colour by day now and
    # then; since 15 Nov the `colour:` block below reads those frames.
    expect: infrared
    # The frame these boxes were drawn on. A box is a position in pixels, so
    # it means nothing on a picture of a different size: if the stream is
    # switched from main to sub, or the camera is swapped, the numbers below
    # would land somewhere else entirely and still produce a confident
    # answer. Checked before every reading, and refused if it does not match.
    frame_size: [1920, 1080]
    units:
      - label: split unit, left wall
        led_roi: [352, 34, 383, 67]
        led_std_threshold: 18.9
        # Added 10 Nov from the 20:32 frame, unit off. Matches the 5 Nov
        # frame with the unit lit at 0.99, so the camera has not moved, and
        # reads ON there (36.47) and OFF tonight (0.95) -- the same numbers
        # as the original calibration. A camera nudged 60px refuses itself
        # instead of reporting a running unit as off for ever.
        # 15 Nov: the anchor moved to the unit's left end. The old
        # one took in the flap and the display's glow, so it matched
        # the unit running (0.89+) and not stopped (0.48-0.55): 39 of
        # 43 night frames with it off were refused as a moved camera
        # and read unknown. This one: from the 14 Nov 01:07 frame
        # (off); every infrared frame kept matched it 0.92+, a 50 px
        # nudge 0.20 at most.
        anchor_roi: [100, 80, 220, 200]
        anchor: 
        # NOT YET CONFIRMED, and no anchor, because this was measured before
        # anchors existed. In the whole-site frame an hour later this box
        # sits on the unit's body rather than over the dark recess that
        # looks like the display, which means either the camera was nudged
        # between the two, or the lit digits really are where the box is and
        # the recess is something else. One frame cannot settle it.
        #
        # To settle it, with the unit RUNNING:
        #     python check_room.py --room "Admin Room"
        # and look at whether the display is where this box is. Then take an
        # on and an off frame and re-run calibrate_room.py with --replace,
        # which writes an anchor and makes a future nudge refuse itself
        # instead of reporting a running unit as off for ever.
        measured:
          on_std: 36.80          # display lit, reading 22
          off_std: 1.07          # display blank
          on_peak: 239
          off_peak: 126
          taken: 2026-11-07T12:14+05:00
          note: >
            A gap of nearly thirty-six between on and off, which is as clean
            as this gets: the threshold could sit anywhere between 5 and 30
            and read the same. Taken forty seconds apart, so the room, the
            light and the camera's gain were identical -- the only thing that
            changed was the unit.
    # By day the camera sometimes comes back in colour (33 of 202 frames
    # kept 13-15 Nov), where the infrared numbers do not hold. Measured
    # 15 Nov from frames/ac_keep, nobody touching the unit: the display's
    # digits lit or blank are plain in every one of them. "On" is the
    # faintest lit display seen in colour (13 Nov 20:04; bright afternoons
    # read 17-18, the rest of the days 26-34), "off" the one colour frame
    # with it blank (14 Nov 07:15) -- one frame, so look again when another
    # colour "off" turns up in ac_keep.
    colour:
      units:
        - label: split unit, left wall
          led_roi: [352, 34, 383, 67]
          led_std_threshold: 9.6
          # The unit's left end, as in infrared, from the colour
          # 'off' frame; every colour frame kept matched it 0.90+,
          # a 50 px nudge 0.49 at most.
          anchor_roi: [100, 80, 220, 200]
          anchor: 
          measured:
            on_std: 17.04          # display lit (13 Nov 20:04)
            off_std: 2.23          # display blank (14 Nov 07:15)
            on_peak: 251
            off_peak: 174
            taken: 2026-11-15T05:45+0500
            # A gap of 14.8 between the two states.


  141 Finance Room:
    recorder: cd_nvr1
    channel: 30
    # The lighting the measurement was taken in. The contrast inside a box
    # depends on it, so a reading under the other kind is refused rather
    # than guessed at.
    expect: colour
    # The frame this box was drawn on. A box is a position in pixels, so it
    # means nothing on a picture of a different size: switch the stream from
    # main to sub and these numbers land somewhere else entirely while still
    # producing a confident answer. Checked before every reading.
    frame_size: [1920, 1080]
    units:
      - label: split unit
        led_roi: [1088, 99, 1103, 112]
        led_std_threshold: 21.6
        # A thumbnail of the unit and the wall round the box, levelled for
        # brightness, compared before every reading. Nudge the camera and the
        # box lands on blank wall, where it reads low contrast for ever and
        # calls a running unit off -- silently, and in the direction nobody
        # notices, because a unit never reported as on sends nobody anywhere.
        # The unit body and the wall above it, not the window below: the
        # afternoon sun through that window read as a moved camera (12 Nov).
        # 15 Nov: moved again, to the floor unit's lower body on the
        # right wall. The unit's top vents above show only under the
        # room light: from 13 Nov 23:36 (light off) nearly every frame
        # matched 0-0.1 and the unit went unread for 32 hours. This one,
        # from the 2026-11-15/0720 frame, matched every colour frame kept 0.80+;
        # a 50 px nudge -0.03 at most.
        anchor_roi: [1680, 760, 1800, 880]
        anchor: 
        measured:
          on_std: 34.56          # display lit
          off_std: 8.73          # display blank
          on_peak: 254
          off_peak: 199
          taken: 2026-11-11T20:57+0500
          # A gap of 25.8 between the two states. The threshold is the
          # midpoint, so anything inside that gap would read the same.
          # Negative means this unit goes DARK when it runs rather than
          # lighting up, and the reading is taken that way round: the
          # direction is read back off these two numbers, not stored
          # separately, so they cannot disagree with each other.

