# 140-H as places and the ways between them (Shamroze, 23 Nov 2026: "entry
# hai, reception hai, basement, ground floor, first floor aur phir cafe --
# pura 3D bana sakte ho; employee jahan jaye camera usko follow kare").
#
# Read by building.py: the Progress tab draws it (building_view.py), and the
# loop's follow mode (progress_follow.py) looks first at the cameras nearest
# to where an employee was last seen, by the number of steps along `links`.
#
# A FIRST DRAFT, from the camera names, their floors in rooms.yaml and the
# cameras' own pictures (19 Nov contact sheets) -- not from a floor plan.
# `at` is a place's spot on a schematic floor (x 0-12 across, y 0-9 deep),
# not a measurement. Links marked "# guess" are the least sure. A floor plan
# (the fire-exit plan on each floor) would put both right.
#
# Every name is a room of rooms.yaml (its cameras come from there); a place
# with `outside: true` is drawn round the building rather than in it.
campus: 140-H
# bottom to top
floors: [Basement, Ground floor, First floor, Cafe floor]

places:
