# The dashboard draws its own surfaces; this is for the chrome Streamlit owns
# -- widgets, scrollbars, the view switch -- so the page does not come out
# half one palette and half another. The same neutrals and blue as the front
# pages (overview.TOKENS, dark).

[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#171716"
textColor = "#f0efec"
font = "sans serif"

[browser]
gatherUsageStats = false
