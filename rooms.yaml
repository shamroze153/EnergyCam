  # ===========================================================================
  # XVR 3 -- H block. Sixteen channels, three of them pointed at nothing.
  # ===========================================================================

  # ---- offices: unit in frame -----------------------------------------------

  - name: Cyber Security Room
    zone: H offices
    recorder: xvr3
    channels: [2]
    ac: visible
    empty_after_minutes: 45

  - name: Room 17
    zone: H offices
    recorder: xvr3
    channels: [3, 5, 8]
    ac: visible
    ac_channel: 5
    empty_after_minutes: 45
    note: >
      Three cameras on one room, and only channel 5 can see the unit. Which
      one matters: calibration is a box drawn on a particular camera's
      picture, so it has to be done on 5 and the other two cannot stand in
      for it. The room still counts as occupied if any of the three sees
      somebody.

  - name: Room 18
    zone: H offices
    recorder: xvr3
    channels: [11, 13]
    ac: visible
    ac_channel: 13
    empty_after_minutes: 45

  - name: H First Floor Lobby
    zone: H common
    recorder: xvr3
    channels: [16]
    ac: visible
    empty_after_minutes: 45
    note: >
      A lobby with a unit in it, which is an odd pair: people pass through
      rather than sit, so it looks empty between passers-by. Left at
      forty-five minutes for now; if it turns out to report all day it wants
      a longer wait rather than switching off.

