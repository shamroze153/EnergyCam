<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10152a">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Alice Pop-Up Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive 3D pop-up edition of Alice's Adventures in Wonderland: turn the pages, watch the scenes stand up, and tap the characters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one full-bleed 3D stage (a book on a library table) with a floating title chip and a bottom control pill. */
:root{
  --table:#1d140e;        /* dark walnut room */
  --panel:rgba(29,20,14,.78);
  --panel-line:rgba(233,214,178,.16);
  --paper:#f4ead3;
  --ink:#2a1d14;
  --gilt:#e0b45c;
  --cloth:#8e2b27;        /* 1865 Macmillan red cloth */
  --text:#f5ecdc;
  --muted:rgba(245,236,220,.62);
  --font-book:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-sc:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --font-ui:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--table);color:var(--text);font-family:var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(8,5,3,.55) 100%)}

.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--panel-line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 16px;min-width:0}
.chip b{font-family:var(--font-book);font-weight:400;font-size:17px;white-space:nowrap}
.chip span{font-family:var(--font-sc);font-size:13px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#where{font-family:var(--font-sc);font-size:13px;letter-spacing:.08em;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;width:100%;max-width:680px;background:var(--panel);
  border:1px solid var(--panel-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:6px}
.icon{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer}
.icon:hover{background:rgba(245,236,220,.08)}
.icon:disabled{opacity:.3;cursor:default;background:transparent}
.icon svg{width:20px;height:20px}
.dots{display:flex;gap:6px;padding:0 6px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(245,236,220,.25);transition:all .3s}
.dots i.on{width:18px;border-radius:3px;background:var(--gilt)}
.cap{flex:1;min-width:0;padding:0 6px;line-height:1.2}
.cap div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#capTitle{font-family:var(--font-book);font-size:17px}
#capSub{font-size:13px;color:var(--muted)}
.act{flex:none;height:40px;border-radius:999px;border:0;padding:0 18px;background:var(--gilt);color:#2a1a0c;
  font-family:var(--font-ui);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;transition:transform .15s,filter .15s}
.act:hover{filter:brightness(1.07)}
.act:active{transform:scale(.97)}
.act:disabled{filter:grayscale(.6) brightness(.8);cursor:default}
button:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}

.bubble{position:fixed;left:0;top:0;max-width:240px;background:#fffaf0;color:var(--ink);font-family:var(--font-book);font-style:italic;
  font-size:17px;line-height:1.25;padding:10px 14px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;
  opacity:0;transition:opacity .25s;transform:translate(-50%,-100%);text-wrap:balance}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fffaf0}
.bubble.show{opacity:1}

.reader{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,6,4,.55);z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.sheet{position:relative;width:100%;max-width:560px;max-height:80vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:6px;
  padding:36px 34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet .ch{font-family:var(--font-sc);letter-spacing:.14em;color:#8a3a2a;text-align:center;font-size:15px}
.sheet h2{font-family:var(--font-book);font-weight:400;font-size:30px;text-align:center;margin:6px 0 18px;text-wrap:balance}
.sheet p{font-family:var(--font-book);font-size:19px;line-height:1.55;margin:0 0 10px;text-indent:1.4em;max-width:65ch}
.sheet p:first-of-type{text-indent:0}
.sheet p.verse{font-style:italic;text-align:center;text-indent:0}
.sheet .close{position:absolute;top:10px;right:10px;color:var(--ink)}
.sheet .close:hover{background:rgba(42,29,20,.08)}

.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--muted);
  background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:6px 14px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--table);z-index:9;transition:opacity .6s}
.loader div{font-family:var(--font-book);font-style:italic;font-size:22px;color:var(--muted)}
.loader.gone{opacity:0;pointer-events:none}

@media (max-width:560px){
  .dots{display:none}
  .chip span{display:none}
  #whereChip{display:none}
  .act{padding:0 14px;font-size:14px}
  #capSub{display:none}
  .icon{width:36px;height:36px}
}
@media (max-width:440px){ .cap{display:none} .act{flex:1} }
@media (prefers-reduced-motion:reduce){ .bubble,.hint,.loader,.dots i{transition:none} }
</style>

<canvas id="stage" tabindex="0" aria-label="3D pop-up book. Use the arrow keys to turn pages and the space bar to play the scene."></canvas>
<div class="vignette"></div>

<div class="top">
  <div class="chip"><b>Alice's Adventures in Wonderland</b><span>Lewis Carroll · Pop-up edition</span></div>
  <div class="chip" id="whereChip"><span id="where">The cover</span></div>
</div>

<div class="bubble" id="bubble" role="status" aria-live="polite"></div>
<div class="hint" id="hint">Drag to look around · Tap the characters</div>

<div class="bar">
  <div class="pill">
    <button class="icon" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="dots" id="dots"></div>
    <div class="cap"><div id="capTitle">Alice's Adventures in Wonderland</div><div id="capSub">Lewis Carroll, 1865</div></div>
    <button class="act" id="act">Open the book</button>
    <button class="icon" id="read" aria-label="Read this page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg></button>
    <button class="icon" id="snd" aria-label="Turn sound off" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path id="sndWave" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/><path id="sndOff" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
    <button class="icon" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>

<div class="reader" id="reader" hidden>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="rTitle">
    <button class="icon close" id="rClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="ch" id="rCh"></div>
    <h2 id="rTitle"></h2>
    <div id="rBody"></div>
  </article>
</div>

<div class="loader" id="loader"><div>Binding the pages…</div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ------------------------------------------------------------------ constants */
const W = 4, D = 5.4;                 // page size (x across, z down the page)
const BT = 0.07, PB = 0.14;           // board thickness, page-block thickness
const Y0 = BT + PB;                   // page surface height
const BW = W + 0.14, BD = D + 0.28;   // board size
const U = 200;                        // canvas px per unit for paper layers
const PX = [1024, 1382];              // page texture size
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  lin: t => t,
};

/* ------------------------------------------------------------------ palette for the paper art */
const C = {
  ink: '#2a1d14', skin: '#f6d0b1', blush: 'rgba(232,110,110,.42)', white: '#fffaf1', gold: '#e2b347',
  red: '#c93b33', blue: '#4f8fd0', yellow: '#f2c33f', black: '#24202c', leaf: '#4f9a4a', leaf2: '#74ba5c',
  leaf3: '#3a7a42', trunk: '#7a4b2a', pink: '#f2a7b8', teal: '#3d6f75', cream: '#f7edd6',
};

/* ------------------------------------------------------------------ canvas helpers */
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const NOISE = (() => {
  const c = mk(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
function layerCanvas(w, h) {
  const c = mk(Math.round(w * U), Math.round(h * U)), g = c.getContext('2d');
  g.setTransform(U, 0, 0, U, 0, 0); g.lineJoin = 'round'; g.lineCap = 'round'; g._u = U; return [c, g];
}
function grain(c, a = .07) {
  const g = c.getContext('2d'); g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = a; g.fillStyle = g.createPattern(NOISE, 'repeat');
  g.fillRect(0, 0, c.width, c.height); g.restore();
}
const circ = (g, x, y, r) => { g.moveTo(x + r, y); g.arc(x, y, r, 0, Math.PI * 2); };
const ell = (g, x, y, rx, ry, rot = 0) => { g.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot)); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); };
const rr = (g, x, y, w, h, r = 0) => {
  r = Math.min(r, w / 2, h / 2); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
};
const poly = (g, p) => { g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); };
function cut(g, fill, build, o = {}) {
  g.save();
  if (o.shadow !== false) { g.shadowColor = o.sc || 'rgba(45,25,10,.34)'; g.shadowBlur = o.blur ?? 8; g.shadowOffsetX = o.ox ?? 0; g.shadowOffsetY = o.oy ?? 3; }
  g.fillStyle = fill; g.beginPath(); build(g); g.fill(); g.restore();
}
function stroke(g, color, width, build, shadow = true, dash) {
  g.save(); if (shadow) { g.shadowColor = 'rgba(45,25,10,.3)'; g.shadowBlur = 5; g.shadowOffsetY = 2; }
  g.strokeStyle = color; g.lineWidth = width; if (dash) g.setLineDash(dash); g.beginPath(); build(g); g.stroke(); g.restore();
}
const dots = (g, color, pts, r) => cut(g, color, g => pts.forEach(([x, y]) => circ(g, x, y, r)), { shadow: false });
function text(g, str, x, y, size, o = {}) {
  const u = g._u; g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.font = `${o.style || ''} ${size * u}px ${o.font || '"IM Fell English", Georgia, serif'}`;
  g.fillStyle = o.color || C.ink; g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  if (o.ls) g.letterSpacing = o.ls * u + 'px';
  g.fillText(str, x * u, y * u); g.restore();
}
function heart(g, x, y, r) { g.moveTo(x, y + r); g.bezierCurveTo(x - r * 1.5, y - r * .1, x - r * .7, y - r * 1.25, x, y - r * .45); g.bezierCurveTo(x + r * .7, y - r * 1.25, x + r * 1.5, y - r * .1, x, y + r); g.closePath(); }
function spade(g, x, y, r) {
  g.moveTo(x, y - r); g.bezierCurveTo(x + r * 1.3, y - r * .1, x + r * .8, y + r * .95, x, y + r * .35);
  g.bezierCurveTo(x - r * .8, y + r * .95, x - r * 1.3, y - r * .1, x, y - r); g.closePath();
  g.moveTo(x, y + r * .15); g.lineTo(x + r * .32, y + r); g.lineTo(x - r * .32, y + r); g.closePath();
}

/* ------------------------------------------------------------------ scenery pieces */
function cloud(g, x, y, s, col = C.white) { cut(g, col, g => { circ(g, x, y, .18 * s); circ(g, x + .2 * s, y - .08 * s, .22 * s); circ(g, x + .42 * s, y, .17 * s); rr(g, x - .1 * s, y - .02 * s, .62 * s, .16 * s, .08 * s); }, { blur: 6, oy: 2 }); }
function tree(g, x, by, s, c1 = C.leaf, c2 = C.leaf2, trunk = C.trunk) {
  cut(g, trunk, g => poly(g, [x - .09 * s, by, x - .05 * s, by - .95 * s, x + .05 * s, by - .95 * s, x + .09 * s, by]));
  cut(g, c1, g => { circ(g, x, by - 1.18 * s, .42 * s); circ(g, x - .33 * s, by - .97 * s, .3 * s); circ(g, x + .34 * s, by - 1 * s, .3 * s); circ(g, x + .02 * s, by - 1.52 * s, .3 * s); });
  cut(g, c2, g => { circ(g, x - .12 * s, by - 1.28 * s, .2 * s); circ(g, x + .2 * s, by - 1.06 * s, .15 * s); circ(g, x - .3 * s, by - .95 * s, .12 * s); }, { blur: 5, oy: 2 });
}
function bushRow(g, x0, x1, by, r, col) { cut(g, col, g => { for (let x = x0; x <= x1 + .001; x += r * 1.3) circ(g, x, by - r * .55 + Math.sin(x * 7) * r * .15, r); rr(g, x0 - r, by - r * .6, x1 - x0 + 2 * r, r * .7, 0); }); }
function daisy(g, x, y, r) { cut(g, C.white, g => { for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; ell(g, x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9, r * .55, r * .3, a); } }, { blur: 3, oy: 1 }); dots(g, C.yellow, [[x, y]], r * .45); }
function mushroom(g, x, by, s, cap = '#d8473b') {
  cut(g, C.cream, g => rr(g, x - .06 * s, by - .3 * s, .12 * s, .3 * s, .04 * s));
  cut(g, cap, g => { g.moveTo(x - .24 * s, by - .26 * s); g.quadraticCurveTo(x, by - .62 * s, x + .24 * s, by - .26 * s); g.closePath(); });
  dots(g, C.white, [[x - .1 * s, by - .34 * s], [x + .05 * s, by - .42 * s], [x + .13 * s, by - .31 * s]], .035 * s);
}
function tufts(g, x0, x1, by, h, col) { cut(g, col, g => { for (let x = x0; x < x1; x += h * .35) { const k = .6 + .4 * Math.abs(Math.sin(x * 13)); poly(g, [x, by, x + h * .12, by - h * k, x + h * .24, by]); } }, { blur: 4, oy: 1 }); }
function arch(g, w, h, r = 1.2) { g.moveTo(.06, h); g.lineTo(.06, r); g.quadraticCurveTo(.06, .04, r, .04); g.lineTo(w - r, .04); g.quadraticCurveTo(w - .06, .04, w - .06, r); g.lineTo(w - .06, h); g.closePath(); }
function backdrop(g, w, h, stops, paint) {
  const gr = g.createLinearGradient(0, 0, 0, h); stops.forEach(([o, c]) => gr.addColorStop(o, c));
  cut(g, gr, g => arch(g, w, h), { blur: 10, oy: 4 });
  g.save(); g.beginPath(); arch(g, w, h); g.clip(); paint(g); g.restore();
  stroke(g, 'rgba(255,255,255,.55)', .025, g => arch(g, w, h), false);
}

/* ------------------------------------------------------------------ characters */
function alice(g, cx, by, k = 1) {
  const X = v => cx + v * k, Y = v => by - v * k;
  cut(g, C.yellow, g => { rr(g, X(-.21), Y(1.42), .42 * k, .44 * k, .12 * k); circ(g, X(0), Y(1.36), .21 * k); });
  cut(g, '#fbf7ef', g => { rr(g, X(-.14), Y(.5), .09 * k, .48 * k, .03 * k); rr(g, X(.05), Y(.5), .09 * k, .48 * k, .03 * k); });
  cut(g, C.black, g => { ell(g, X(-.1), Y(.03), .09 * k, .045 * k); ell(g, X(.1), Y(.03), .09 * k, .045 * k); });
  cut(g, C.skin, g => { rr(g, X(-.29), Y(1.04), .075 * k, .42 * k, .035 * k); rr(g, X(.215), Y(1.04), .075 * k, .42 * k, .035 * k); });
  cut(g, C.blue, g => { g.moveTo(X(-.15), Y(1.13)); g.lineTo(X(.15), Y(1.13)); g.lineTo(X(.4), Y(.46)); g.quadraticCurveTo(X(0), Y(.36), X(-.4), Y(.46)); g.closePath(); circ(g, X(-.18), Y(1.06), .085 * k); circ(g, X(.18), Y(1.06), .085 * k); });
  cut(g, C.white, g => { g.moveTo(X(-.11), Y(.92)); g.lineTo(X(.11), Y(.92)); g.lineTo(X(.29), Y(.5)); g.quadraticCurveTo(X(0), Y(.43), X(-.29), Y(.5)); g.closePath(); rr(g, X(-.09), Y(1.12), .18 * k, .22 * k, .03 * k); }, { blur: 4, oy: 2 });
  cut(g, C.skin, g => { rr(g, X(-.04), Y(1.21), .08 * k, .1 * k, .02 * k); circ(g, X(0), Y(1.33), .165 * k); });
  cut(g, C.yellow, g => ell(g, X(0), Y(1.45), .18 * k, .085 * k), { blur: 3, oy: 1 });
  stroke(g, C.black, .045 * k, g => g.arc(X(0), Y(1.36), .2 * k, Math.PI * 1.12, Math.PI * 1.88));
  dots(g, C.ink, [[X(-.06), Y(1.32)], [X(.06), Y(1.32)]], .02 * k);
  dots(g, C.blush, [[X(-.1), Y(1.27)], [X(.1), Y(1.27)]], .032 * k);
  stroke(g, C.ink, .013 * k, g => g.arc(X(0), Y(1.27), .04 * k, .2 * Math.PI, .8 * Math.PI), false);
}

function paperMesh(c, w, h, px = .5, py = 0) {
  const geo = new THREE.PlaneGeometry(w, h); geo.translate((.5 - px) * w, (.5 - py) * h, 0);
  const t = pageTex(c); t.anisotropy = 4;
  const m = new THREE.Mesh(geo, lam({ map: t, alphaTest: .5, alphaToCoverage: true, side: THREE.DoubleSide }));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function buildSpread(sp, si) {
  sp.lc = leftPageCanvas(sp); sp.lT = pageTex(sp.lc); sp.lTm = pageTex(sp.lc, true);
  sp.rT = pageTex(rightPageCanvas(sp));
  sp.root = new THREE.Group(); sp.root.visible = false; book.add(sp.root);
  sp.o = {}; sp.hinges = [];
  sp.layers.forEach((L, li) => {
    const hinge = new THREE.Group(); hinge.position.set(L.x, Y0 + .006 + li * .005, L.z); sp.root.add(hinge); sp.hinges.push(hinge);
    if (L.draw) { const [c, g] = layerCanvas(L.w, L.h); L.draw(g, L.w, L.h); grain(c); hinge.add(paperMesh(c, L.w, L.h)); }
    (L.props || []).forEach(P => {
      const [c, g] = layerCanvas(P.w, P.h); P.draw(g, P.w, P.h); grain(c);
      const m = paperMesh(c, P.w, P.h, P.px ?? .5, P.py ?? 0);
      const grp = new THREE.Group(); grp.position.set(P.x, P.y, P.dz ?? .012); grp.add(m); hinge.add(grp);
      const rec = { grp, mesh: m, P, canvas: c };
      if (P.live) { rec.orig = mk(c.width, c.height); rec.orig.getContext('2d').drawImage(c, 0, 0); }
      if (P.tint) m.material = m.material.clone();
      sp.o[P.id] = rec;
      if (P.tap) { m.userData = { spread: si, id: P.id }; taps.push(m); }
    });
  });
}
function setVanish(rec, p) {
  const c = rec.canvas, g = c.getContext('2d'), w = c.width, h = c.height;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h); g.drawImage(rec.orig, 0, 0);
  if (p > 0) {
    const x = p * (w * 1.25) - w * .1, soft = w * .18;
    g.globalCompositeOperation = 'destination-out';
    const gr = g.createLinearGradient(x - soft, 0, x, 0); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = '#000'; g.fillRect(0, 0, Math.max(0, x - soft), h); g.fillStyle = gr; g.fillRect(x - soft, 0, soft, h);
  }
  g.restore(); rec.mesh.material.map.needsUpdate = true;
}
function setRise(sp, p, rising) {
  const n = sp.hinges.length, stg = .1, span = 1 - (n - 1) * stg;
  sp.hinges.forEach((hg, i) => {
    const q = clamp((p - (rising ? i : n - 1 - i) * stg) / span, 0, 1), r = rising ? E.back(q) : q;
    hg.rotation.x = -(Math.PI / 2) * (1 - r); hg.visible = r > .004;
    if (rising && q > 0 && !hg.userData.popped) { hg.userData.popped = true; sfx.pop(.7 + i * .12); }
  });
}
function rise(sp) { sp.hinges.forEach(h => h.userData.popped = false); return tween(1.5, p => setRise(sp, p, true)); }
function fold(sp) { return tween(.55, p => setRise(sp, 1 - p, false), E.in); }

/* ------------------------------------------------------------------ tweens */
const tweens = [];
function tween(dur, fn, ease = E.lin) { return new Promise(res => tweens.push({ t0: performance.now(), d: dur * (REDUCE ? .35 : 1) * 1000, fn, ease, res })); }
const wait = ms => tween(ms / 1000, () => {});
function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) { const t = tweens[i], p = Math.min(1, (now - t.t0) / t.d); t.fn(t.ease(p)); if (p >= 1) { tweens.splice(i, 1); t.res(); } }
}

/* ------------------------------------------------------------------ sound (synthesised, no files) */
const sfx = (() => {
  let ac = null, on = true, nb = null;
  const ctx = () => { if (!on) return null; try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { return null; } return ac; };
  const noise = a => { if (nb) return nb; nb = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return nb; };
  const env = (a, g, t, peak, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + dur * .25); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
  const burst = (type, f0, f1, dur, peak) => { const a = ctx(); if (!a) return; const t = a.currentTime, s = a.createBufferSource(); s.buffer = noise(a); const f = a.createBiquadFilter(); f.type = type; f.Q.value = .9; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = a.createGain(); env(a, g, t, peak, dur); s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + .05); };
  const tone = (f0, f1, dur, peak, type = 'sine', delay = 0) => { const a = ctx(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = a.createGain(); env(a, g, t, peak, dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05); };
  return {
    get on() { return on; }, set on(v) { on = v; },
    unlock() { ctx(); },
    flip() { burst('bandpass', 500, 2600, .7, .28); },
    pop(r = 1) { burst('highpass', 1800 * r, 3000 * r, .06, .12); tone(420 * r, 160 * r, .09, .08); },
    thud() { tone(110, 50, .3, .3); burst('lowpass', 400, 120, .2, .2); },
    chime(fs) { fs.forEach((f, i) => tone(f, f * 1.002, .35, .07, 'triangle', i * .12)); },
    gliss(a, b, d) { tone(a, b, d, .07, 'triangle'); },
    sparkle() { [1200, 1500, 1800, 2200, 2600].forEach((f, i) => tone(f, f * 1.01, .25, .04, 'sine', i * .09)); },
    pour() { burst('lowpass', 900, 500, 1.1, .09); },
  };
})();

/* ------------------------------------------------------------------ state + navigation */
const S = { cur: -1, busy: false, acting: false, cover: 0, read: false };
function applyCover() {
  const c = S.cover;
  coverPivot.rotation.z = c * Math.PI;
  const open = c > .965; leftBlock.visible = leftPage.visible = open;
  const sy = lerp(Y0 + BT + .002, Y0 - .03, E.inOut(clamp(c * 1.4, 0, 1))); spine.scale.y = sy;
}
async function go(dir) {
  if (S.busy || S.acting) return;
  const n = S.cur + dir; if (n < -1 || n >= SP.length) return;
  S.busy = true; hideBubble(); ui();
  if (S.cur === -1) await openCover();
  else if (n === -1) await closeCover();
  else await turn(dir);
  S.cur = n; S.busy = false; ui();
}
async function openCover() {
  const sp = SP[0]; rightPage.material.map = sp.rT; leftPage.material.map = sp.lT;
  sp.root.visible = true; sp.reset?.(sp.o); setRise(sp, 0, true);
  sfx.flip(); sfx.thud(); let rp = null;
  await tween(1.6, p => { S.cover = p; applyCover(); if (p > .62 && !rp) rp = rise(sp); }, E.inOut);
  S.cur = 0; ui(); await rp;
}
async function closeCover() {
  const sp = SP[0]; await fold(sp); sp.root.visible = false; sfx.flip();
  await tween(1.3, p => { S.cover = 1 - p; applyCover(); }, E.inOut); sfx.thud();
}
async function turn(dir) {
  const a = SP[S.cur], b = SP[S.cur + dir];
  await fold(a); a.root.visible = false;
  b.root.visible = true; b.reset?.(b.o); setRise(b, 0, true);
  leaf.visible = true; sfx.flip(); let rp = null;
  if (dir > 0) {
    rightPage.material.map = b.rT; leafFront.material.map = a.rT; leafBack.material.map = b.lTm; setLeaf(0, 1);
    await tween(1.15, p => { setLeaf(p, 1); if (p > .74 && !rp) rp = rise(b); }, E.inOut);
    leftPage.material.map = b.lT;
  } else {
    leftPage.material.map = b.lT; leafFront.material.map = b.rT; leafBack.material.map = a.lTm; setLeaf(1, -1);
    await tween(1.15, p => setLeaf(1 - p, -1), E.inOut);
    rightPage.material.map = b.rT; rp = rise(b);
  }
  leaf.visible = false; S.cur += dir; ui(); await rp; S.cur -= dir;
}
async function act(id) {
  if (S.busy || S.acting) return;
  if (S.cur < 0) { go(1); return; }
  const sp = SP[S.cur]; S.acting = true; ui();
  try { await sp.action(sp.o, id); } finally { S.acting = false; ui(); }
}

/* ------------------------------------------------------------------ UI */
const dotsEl = $('dots');
for (let i = -1; i < SP.length; i++) dotsEl.appendChild(document.createElement('i'));
function ui() {
  const sp = SP[S.cur], closed = S.cur < 0, lock = S.busy || S.acting;
  $('prev').disabled = closed || lock; $('next').disabled = S.cur >= SP.length - 1 || lock;
  $('act').disabled = lock; $('read').disabled = closed;
  $('act').textContent = closed ? 'Open the book' : sp.button(sp.o);
  $('capTitle').textContent = closed ? "Alice’s Adventures in Wonderland" : sp.title;
  $('capSub').textContent = closed ? 'Lewis Carroll, 1865 · with five moving scenes' : sp.hint;
  $('where').textContent = closed ? 'The cover' : `${sp.chapter.replace(/\.$/, '')} · Page ${sp.page}`;
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === S.cur + 1));
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('act').onclick = () => { sfx.unlock(); act(); };
$('snd').onclick = () => {
  sfx.on = !sfx.on; $('snd').setAttribute('aria-pressed', String(sfx.on)); $('snd').setAttribute('aria-label', sfx.on ? 'Turn sound off' : 'Turn sound on');
  $('sndWave').style.display = sfx.on ? '' : 'none'; $('sndOff').style.display = sfx.on ? 'none' : '';
};
function openReader() {
  const sp = SP[S.cur]; if (!sp) return;
  $('rCh').textContent = sp.chapter; $('rTitle').textContent = sp.title;
  $('rBody').replaceChildren(...sp.paras.map(t => { const p = document.createElement('p'); if (t.startsWith('*')) { p.className = 'verse'; t = t.slice(1); } p.textContent = t; return p; }));
  $('reader').hidden = false; $('rClose').focus();
}
$('read').onclick = openReader;
$('rClose').onclick = () => { $('reader').hidden = true; $('read').focus(); };
$('reader').addEventListener('click', e => { if (e.target === $('reader')) $('reader').hidden = true; });
addEventListener('keydown', e => {
  if (!$('reader').hidden) { if (e.key === 'Escape') $('reader').hidden = true; return; }
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
  else if ((e.key === ' ' || e.key === 'Enter') && document.activeElement === canvas) { e.preventDefault(); sfx.unlock(); act(); }
});

/* speech bubble anchored to a 3D prop */
const bubbleEl = $('bubble'); let bub = null;
function bubble(txt, rec, yUnits, ms) { bubbleEl.textContent = txt; bub = { rec, y: yUnits, until: performance.now() + ms }; bubbleEl.classList.add('show'); }
function hideBubble() { bub = null; bubbleEl.classList.remove('show'); }
const tmpV = new THREE.Vector3();
function placeBubble(now) {
  if (!bub) return; if (now > bub.until) { hideBubble(); return; }
  bub.rec.grp.localToWorld(tmpV.set(0, bub.y + .06, 0)).project(camera);
  const x = (tmpV.x * .5 + .5) * innerWidth, y = (-tmpV.y * .5 + .5) * innerHeight;
  const half = Math.min(120, bubbleEl.offsetWidth / 2);
  bubbleEl.style.left = clamp(x, half + 12, innerWidth - half - 12) + 'px'; bubbleEl.style.top = clamp(y, 90, innerHeight) + 'px';
}

/* ------------------------------------------------------------------ camera: framing + drag to look around */
const cam = { yaw: 0, pitch: .78, zoom: 1, tx: W / 2, dist: 14, tyaw: 0, tpitch: .78, intro: 1.3 };
function targetFrame() {
  const aspect = innerWidth / innerHeight, portrait = aspect < .95, closed = S.cur < 0 && S.cover < .5;
  const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), ht = vt * aspect;
  const fx = closed ? BW / 2 : portrait ? W / 2 + .1 : 0;
  const halfW = closed ? 2.9 : portrait ? 2.55 : 4.75;
  const halfH = closed ? 3.2 : portrait ? 3.6 : 3.95;
  return { fx, dist: Math.max(halfW / ht, halfH / vt) };
}
const ptrs = new Map(); let dragMoved = 0, pinch0 = 0, zoom0 = 1;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); dragMoved = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = cam.zoom; } });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) { hover(e); return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; cam.zoom = clamp(zoom0 * pinch0 / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), .6, 1.4); dragMoved += 99; return; }
  dragMoved += Math.abs(dx) + Math.abs(dy);
  cam.tyaw = clamp(cam.tyaw - dx * .005, -.75, .75); cam.tpitch = clamp(cam.tpitch + dy * .004, .3, 1.2);
});
const endPtr = e => {
  if (ptrs.has(e.pointerId) && ptrs.size === 1 && dragMoved < 6) { sfx.unlock(); pick(e); }
  ptrs.delete(e.pointerId);
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * (1 + e.deltaY * .001), .6, 1.4); }, { passive: false });
canvas.addEventListener('dblclick', () => { cam.tyaw = 0; cam.tpitch = .78; cam.zoom = 1; });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const live = taps.filter(m => m.userData.spread === S.cur && m.parent.parent.visible);
  return ray.intersectObjects(live, false)[0];
}
function pick(e) {
  if (S.cur < 0) { const r = (ray.setFromCamera(ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera), ray.intersectObject(coverPivot, true)); if (r.length) go(1); return; }
  const h = hitAt(e); if (h) act(h.object.userData.id);
}
let hoverT = 0;
function hover(e) { const now = performance.now(); if (now - hoverT < 60) return; hoverT = now; canvas.style.cursor = (S.cur >= 0 ? hitAt(e) : null) ? 'pointer' : 'grab'; }

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

/* ------------------------------------------------------------------ main loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  runTweens(now);
  const f = targetFrame(), k = 1 - Math.pow(.02, dt);
  cam.tx = lerp(cam.tx, f.fx, k * .8); cam.dist = lerp(cam.dist, f.dist, k * .8);
  cam.intro = lerp(cam.intro, 1, k * .5);
  cam.yaw = lerp(cam.yaw, cam.tyaw + (ptrs.size || REDUCE ? 0 : Math.sin(now * .00018) * .05), k); cam.pitch = lerp(cam.pitch, cam.tpitch, k);
  const d = cam.dist * cam.zoom * cam.intro, T = new THREE.Vector3(cam.tx, 1.0, .35);
  camera.position.set(T.x + d * Math.sin(cam.yaw) * Math.cos(cam.pitch), T.y + d * Math.sin(cam.pitch), T.z + d * Math.cos(cam.yaw) * Math.cos(cam.pitch));
  camera.lookAt(T);
  const sp = SP[S.cur]; if (sp && sp.tick && !S.busy) sp.tick(sp.o, now / 1000);
  renderer.render(scene, camera);
  placeBubble(now);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ boot */
async function boot() {
  try {
    await Promise.race([
      Promise.all(['40px "IM Fell English"', 'italic 40px "IM Fell English"', '40px "IM Fell English SC"'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 3500)),
    ]);
  } catch (e) { /* fall back to Georgia */ }
  SP.forEach(buildSpread);
  buildBook(); applyCover(); resize(); ui();
  requestAnimationFrame(t => { last = t; frame(t); });
  $('loader').classList.add('gone');
  setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
  window.__book = { go, act, S, SP, cam, leafAt(t, dir = 1) { leaf.visible = true; leafFront.material.map = SP[0].rT; leafBack.material.map = SP[1].lTm; setLeaf(t, dir); } };
}
boot();
