# 140-H, recorder NVR 4 (192.168.67.57) -- 32 channels, all live.
#
# Every channel here is watched. The ac: label does not decide whether a camera
# is used; it decides what that camera's room is allowed to claim:
#
#   visible   the unit is in frame -> "empty, and still running" can be stated
#             outright, so the alert names waste rather than asking anyone to
#             go and look.
#   hidden    the room has a unit the camera cannot see -> the alert can only
#             say the room has been empty a while; somebody walks past and
#             checks the unit.
#   none      there is no unit here at all. The cameras still run and still
#             count people -- that history is worth having -- but the room
#             never raises an air-conditioner alert, because there is nothing
#             in it to switch off.
#   unknown   nobody has said yet. Deliberately not given a default: guessing
#             "none" on a room that does have a unit silently drops it from
#             the thing this system exists to do.
#
# Several cameras can cover one room. A room counts as empty only when every
# one of its cameras agrees it is empty -- one camera seeing a person is enough
# to keep the room occupied, because a person out of one camera's view is still
# a person in the room.
#
# empty_after_minutes is how long a room stays empty before it is worth saying
# anything. Short enough to catch a real lapse, long enough that stepping out
# for a few minutes does not set it off.
#
# Two optional lines deal with a camera that keeps seeing a person who is not
# there -- a poster, a mannequin, a coat on a chair, a reflection in a glass
# door. A room stuck at one person is never counted as empty, so it quietly
# stops being watched for waste, which is why this is worth fixing rather than
# living with.
#
#   ignore:        boxes, per channel, where this camera reliably sees a false
#     10:          person. A detection is dropped only when most of it sits
#       - [x1, y1, x2, y2]   inside the box, so a real person standing in
#                            front of the poster is bigger, reaches outside
#                            it, and is still counted.
#   conf: 0.45     a stricter confidence for this room alone. Use it when the
#                  false detections are faint and scattered rather than in one
#                  spot. Prefer a zone: a confidence applies to the whole
#                  room, including the far corner where somebody is half
#                  hidden behind a monitor.
#
# Do not guess either one. Run `python check_room.py --room "<name>"`: it
# draws every detection on a live frame with its score and prints the exact
# lines to paste here.
#
# Credentials are NOT in this file. They come from .env, which is not committed.

# Numbers the dashboard uses to turn empty cooled-room time into electricity,
# money and carbon. Every one of them is an assumption, not a measurement, and
# they live here rather than inside the code so that anyone who disagrees can
# see what they are disagreeing with and change it in one place.
#
# They answer a conditional question -- IF the units in those empty rooms were
# running, this is what it would amount to -- and the dashboard says so. None
# of it becomes a saving until two things exist that do not exist yet: a
# calibrated unit, so the state is measured rather than supposed, and a record
# of somebody acting on an alert, so the difference is attributable to this
# system rather than to the weather.
# A blurred still per air-conditioned room, so somebody leaving at seven can
# look before they walk. Off by default, and narrow when on: blurred with the
# same pass the alert snapshots use, so faces and screens are gone before the
# file is written; a still, not a stream; only rooms with a unit; overwritten
# each pass rather than accumulated, so no archive of the building builds up;
# and never near the database, which holds counts and nothing else by design.
#
# Pictures are a different kind of data from counts, and the review that set
# this system's handling rules was about counts. Turning this on is worth a
# word with whoever signed that off, and with HR -- not because it is
# dangerous, but because it is a change they should hear about from you rather
# than notice later.
# When the building is in use. A room empty for forty-five minutes at two in
# the afternoon has somebody in a meeting; the same room empty for forty-five
# minutes at eleven at night has nobody coming back. The wait before reporting
# should not be the same number at both, so outside these hours -- evenings,
# nights, and all of Saturday and Sunday -- it drops to the short one.
#
# A room whose own figure is already shorter keeps its own: the off-hours
# number only ever shortens the wait, never lengthens it.
#
# Public holidays are not in here, because nothing knows them. On Eid the
# building will look like a long weekday to this, and report rooms after
# forty-five minutes instead of ten. Worth remembering rather than worth
# guessing at.
hours:
  operations:
    days: [mon, tue, wed, thu, fri]
    start: "10:00"
    end: "20:00"
  off_hours_empty_after_minutes: 10

snapshots:
  enabled: false

assumptions:
  unit_kw: 1.2                 # a split unit while it is actually cooling
  tariff_rs_per_kwh: 55        # replace with the effective rate off the bill
  co2_kg_per_kwh: 0.45         # grid average; the national figure moves
  co2_kg_per_tree_year: 21     # what one mature tree takes up in a year

recorders:
  nvr4:
    campus: 140-H
    host: 192.168.67.57
    brand: hikvision     # decides the RTSP path; confirmed by scanning
    user_env: NVR4_USER
    pass_env: NVR4_PASS
    stream: sub          # 640x360, enough to find people
    note: >
      Covers the cafe, the basement, the solar array and the utility yards.
      Worth being plain about what this recorder is for: of its seventeen
      rooms, two have a unit in frame and two have one out of frame. The other
      thirteen have no air conditioner at all. So the saving here is small, and
      what this recorder mostly produces is occupancy -- which room is used,
      and until what time. The offices at 140-H, where the units actually run
      late, are on DVR 2.

  dvr2:
    campus: 140-H
    host: 192.168.67.74
    brand: dahua         # confirmed: the Hikvision path answers 404 here
    user_env: DVR2_USER
    pass_env: DVR2_PASS
    stream: main         # the sub stream is 352x288, too small to work with
    channels: 16
    dhcp_warning: true
    note: >
      Sixteen channels, and the offices are on this one. Three things about it
      differ from NVR 4 and all three matter.

      Most channels come back 960x1080. That is 1080N: the recorder keeps half
      the horizontal detail and stretches it back on playback, so the picture
      arrives squashed sideways. Fed in as-is, a standing person is a tall thin
      column and the detector is being shown a shape it was never trained on.
      These frames need widening to 1920x1080 before anything looks at them.

      The sizes are not uniform -- channel 8 is 960x576, channels 11 and 12 are
      1280x720 and need no correction. So the widening has to be decided per
      frame from its own dimensions, not once per recorder.

      Its address is handed out by DHCP, so it is borrowed, not owned. Ask for
      a reservation on fc:b6:9d:72:8f:48, or the system goes quiet one morning
      for a reason nobody will think to look for.

  nvr1:
    campus: 140-H
    host: 192.168.67.80
    brand: hikvision     # found by scanning, not assumed from the MAC
    channels: 32
    user_env: NVR1_USER
    pass_env: NVR1_PASS
    stream: sub          # revisit once a scan shows what the sub stream is
    note: >
      Not surveyed yet, and the brand is left out on purpose -- the scanner
      finds it from whichever path answers.

      Its address is static, not handed out by DHCP like DVR 2 and XVR 3, so
      this one will not change underneath us and needs no reservation.

      Its MAC begins 08:a1:89 where the other recorders begin fc:b6:9d, a
      different manufacturer, and it turned out to be a Hikvision all the
      same. Which is the point of asking rather than inferring: the MAC said
      "different maker" and the maker was the same, while DVR 2's neighbour
      said "Hikvision" and it was a Dahua. Neither hint was any good.
    rooms_pending: true

  xvr3:
    campus: 140-H
    host: 192.168.67.23
    brand: dahua         # found by scanning
    channels: 16
    user_env: XVR3_USER
    pass_env: XVR3_PASS
    stream: main         # the sub stream is 352x288, same as DVR 2
    dhcp_warning: true
    note: >
      A Dahua, like DVR 2, and with the same catch: its sub stream is 352x288,
      which is too small to find people reliably and far too small to read an
      indicator light. It reads the main stream instead.

      Its address is handed out by DHCP, like DVR 2's. Ask for a reservation
      on fc:b6:9d:72:8e:08 or this one goes quiet one morning too.
    rooms_pending: true

rooms:

  # ===========================================================================
  # DVR 2 -- the offices. Thirteen of its sixteen cameras have a unit in frame.
  # ===========================================================================

  # ---- never alerted on, whatever the cameras see ---------------------------
  #
  # These two are cooled around the clock on purpose, and the cooling is not
  # waste: it is what keeps the equipment alive. They are empty of people
  # almost all the time, so on occupancy alone they would be the loudest
  # rooms in the building -- every night, every weekend, "empty for hours and
  # still running".
  #
  # That alarm would be wrong in the one direction that actually costs money.
  # Everything else here risks a wasted walk down a corridor; acting on this
  # one risks a server room with its cooling switched off. Alerting and
  # trusting people to ignore it is not a safeguard, because an alert that is
  # correct to ignore teaches everyone to ignore the rest as well.
  #
  # So they are watched -- the occupancy history is worth having, and a person
  # in the data centre at 3am is worth knowing about -- and they never alert.

  - name: UPS Room
    zone: Server rooms
    recorder: dvr2
    channels: [5]
    ac: visible
    alert: never
    empty_after_minutes: null
    note: >
      Battery life falls off sharply with temperature. Cooling here is not
      discretionary.

  - name: Data Centre Operations
    zone: Server rooms
    recorder: dvr2
    channels: [6]
    ac: visible
    alert: never
    empty_after_minutes: null

  # ---- offices: unit in frame -----------------------------------------------

  - name: DL Department
    zone: Offices
    recorder: dvr2
    channels: [1]
    ac: visible
    empty_after_minutes: 45

  - name: HR Room
    zone: Offices
    recorder: dvr2
    channels: [2]
    ac: visible
    empty_after_minutes: 45

  - name: Marketing
    zone: Offices
    recorder: dvr2
    channels: [3, 13]
    ac: visible
    empty_after_minutes: 45
    note: >
      Two cameras, written down as "marketingroom" and "marketing". Grouped on
      the assumption they are one room, and that way round on purpose: if two
      cameras really do watch one room and are treated as two, then one of them
      seeing an empty half of the room raises "empty, and still running" while
      somebody is sitting in the other half. Grouping two separate rooms by
      mistake only costs a missed alert. Worth confirming, but the cost of
      being wrong is not symmetric.

  - name: Creative Room
    zone: Offices
    recorder: dvr2
    channels: [4]
    ac: visible
    empty_after_minutes: 45

  - name: Admin Room
    zone: Offices
    recorder: dvr2
    channels: [9]
    ac: visible
    empty_after_minutes: 45

  - name: AutoOS
    zone: Offices
    recorder: dvr2
    channels: [10, 14]
    ac: visible
    empty_after_minutes: 45
    note: Two cameras assumed to be one room, as with Marketing.

  - name: IT Head Room
    zone: Offices
    recorder: dvr2
    channels: [11]
    ac: visible
    empty_after_minutes: 30
    note: >
      A single-occupant office empties completely and predictably, so thirty
      minutes rather than forty-five.

  - name: Wellows
    zone: Offices
    recorder: dvr2
    channels: [15, 16]
    ac: visible
    empty_after_minutes: 45
    note: Two cameras assumed to be one room, as with Marketing.

  # ---- lobbies: no unit -----------------------------------------------------

  - name: First Floor Lobby
    zone: Offices
    recorder: dvr2
    channels: [7]
    ac: none
    empty_after_minutes: null

  - name: Lobby 1
    zone: Offices
    recorder: dvr2
    channels: [8]
    ac: none
    empty_after_minutes: null

  - name: Lobby
    zone: Offices
    recorder: dvr2
    channels: [12]
    ac: none
    empty_after_minutes: null
    note: >
      Three lobbies written down under three different names and kept apart on
      that basis. Nothing turns on it -- none of them has a unit -- so the only
      cost of being wrong is a confusing name on the dashboard.

  # ===========================================================================
  # NVR 1 -- H block perimeter and entrance. Thirty-two channels, and all but
  # four of them look at somewhere there is nothing to switch off.
  # ===========================================================================

  - name: 140-H Reception
    zone: H entrance
    recorder: nvr1
    channels: [11, 16]
    ac: visible
    empty_after_minutes: 45
    note: >
      Two cameras and the unit is in frame on both, which is the easy case:
      either can be calibrated and the other checks it.

  - name: H First Floor Lobby (NVR 1)
    zone: H offices
    recorder: nvr1
    channels: [22]
    ac: visible
    empty_after_minutes: 45
    note: >
      XVR 3 channel 16 is also called "H 1st floor Lobby". If these are the
      same place seen by two recorders they should be one room, and the
      suffix should go -- but they cannot be merged as things stand, because
      a room here belongs to a single recorder. Kept apart and labelled
      rather than quietly merged: two recorders watching one room, counted as
      two rooms, would double its empty hours in every figure on the page.
      Worth settling on site.

  - name: 140-H Board Room
    zone: H offices
    recorder: nvr1
    channels: [24]
    ac: hidden
    empty_after_minutes: 30
    note: >
      A board room empties all at once and the unit gets left on, so thirty
      minutes rather than forty-five. If its unit can be brought into frame
      this is a good one to re-aim: it would move from "go and look" to "this
      is running in an empty room".

  # ---- entrance ------------------------------------------------------------

  - name: 140-H Entry Area
    zone: H entrance
    recorder: nvr1
    channels: [1]
    ac: none
    empty_after_minutes: null

  - name: Entry H
    zone: H entrance
    recorder: nvr1
    channels: [5]
    ac: none
    empty_after_minutes: null

  - name: 140-H After Entrance
    zone: H entrance
    recorder: nvr1
    channels: [14]
    ac: none
    empty_after_minutes: null

  - name: Attendance Machine H
    zone: H entrance
    recorder: nvr1
    channels: [17]
    ac: none
    empty_after_minutes: null
    note: >
      Worth noting for later rather than now: this camera watches the place
      everyone passes on the way in. Of all the occupancy on this campus it
