<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tank Level</title>
<style>
@font-face{font-family:"News";src:url(data:font/woff2;base64,{{SERIF}}) format("woff2");font-style:normal;font-weight:400;font-display:block}
@font-face{font-family:"News";src:url(data:font/woff2;base64,{{SERIF_ITALIC}}) format("woff2");font-style:italic;font-weight:400;font-display:block}
:root{
  --black:#000; --deep:#010719; --navy:#0c1a33; --royal:#113984; --royal2:#00246c;
  --orange:#ff7b22; --orange2:#ff9a52; --peach:#ffd8bf; --ice:#bedbfb;
  --text:#fff; --muted:rgba(255,255,255,.62); --line:rgba(255,255,255,.12);
  --low:#ff3d3d;
  --serif:"News",Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--black);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.num{font-variant-numeric:lining-nums tabular-nums}

/* ---- top bar, like the website ---- */
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:16px 20px;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{height:22px;display:block}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#35d07f;animation:ping 1.8s infinite}
.live.off i{background:var(--low);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(53,208,127,.55)}70%,100%{box-shadow:0 0 0 9px rgba(53,208,127,0)}}
.now{justify-self:end;font-size:13px;color:var(--muted)}

/* ---- hero: blue glow + glowing monolith tank ---- */
.hero{position:relative;overflow:hidden;text-align:center;padding:34px 18px 40px;
  background:
    linear-gradient(180deg,transparent 82%,#000 100%),
    radial-gradient(60% 55% at 50% 72%,rgba(255,123,34,.28),transparent 70%),
    radial-gradient(70% 70% at 0% 85%,rgba(17,57,132,.95),transparent 70%),
    radial-gradient(70% 70% at 100% 80%,rgba(0,36,108,.95),transparent 70%),
    linear-gradient(180deg,#000 0%,var(--deep) 30%,#051a52 100%)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8.5vw,64px);line-height:1;letter-spacing:-.01em;margin-top:12px}
h1 em{font-style:italic}

.stage{position:relative;max-width:360px;margin:26px auto 0}
.big{position:relative;z-index:2;font-family:var(--serif);font-size:clamp(108px,32vw,180px);line-height:.8;letter-spacing:-.035em;
  margin-bottom:-.36em;text-shadow:0 6px 30px rgba(0,0,0,.25)}
.big .pc{font-style:italic;font-size:.42em;margin-left:.06em;letter-spacing:0}
.tank{display:block;width:100%;height:auto;overflow:visible}
.mono{filter:drop-shadow(0 0 28px rgba(255,123,34,.55)) drop-shadow(0 0 70px rgba(255,123,34,.25))}
.low .mono{animation:alarm 1.2s ease-in-out infinite}
@keyframes alarm{50%{filter:drop-shadow(0 0 30px rgba(255,61,61,.9)) drop-shadow(0 0 80px rgba(255,61,61,.45))}}
.g0{stop-color:var(--orange)} .g1{stop-color:var(--orange2)} .g2{stop-color:#f6e6ea} .g3{stop-color:var(--ice)}
.wa{stop-color:#3b6cff} .wb{stop-color:#0a2a8c}
.lvl{transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
.w1{animation:wave 4s linear infinite}
.w2{animation:wave 6.5s linear infinite reverse}
@keyframes wave{to{transform:translateX(120px)}}
.bub{fill:rgba(255,255,255,.6);animation:rise 5s ease-in infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-240px);opacity:0}}
.maxline{stroke:var(--navy);stroke-width:1.6;stroke-dasharray:6 5;opacity:.75}
.maxlabel{fill:var(--navy);font:700 10px var(--sans);letter-spacing:.14em}
.tick{stroke:rgba(255,255,255,.4);stroke-width:1.5}
.tlabel{fill:rgba(255,255,255,.7);font:12px var(--sans)}

/* split badge, like "31st October | Save the date" */
.split{display:inline-flex;margin-top:26px;font-weight:700;font-size:15px}
.split span{padding:10px 16px}
.split .l{background:var(--navy)}
.split .r{background:var(--ice);color:var(--navy)}
.mid .split .r{background:var(--orange);color:#fff}
.low .split .r{background:var(--low);color:#fff}
.na .split .r{background:#5b6475;color:#fff}

/* orange pill, like "Joining us? (->)" */
.cta{display:inline-flex;align-items:center;gap:18px;margin-top:22px;padding:8px 8px 8px 26px;border:0;border-radius:999px;cursor:pointer;
  font:inherit;color:#2a1206;text-align:left;
  background:linear-gradient(90deg,#ff9a5a 0%,var(--orange) 45%,#ffad7a 100%);
  box-shadow:0 0 0 6px rgba(255,123,34,.14),0 14px 34px rgba(255,123,34,.35)}
.cta small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.cta b{display:block;font-size:19px}
.cta i{width:46px;height:46px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.cta svg{width:20px;height:20px;stroke:var(--peach);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cta.spin svg{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* low water banner */
.alert{display:none;justify-content:center;padding:0 18px;margin-top:18px}
.low .alert{display:flex}
.alert div{display:flex;font-weight:700;font-size:15px;animation:blink 1.2s ease-in-out infinite}
.alert div>span{padding:11px 16px}
.alert .l{background:var(--low)}
.alert .r{background:var(--navy)}
@keyframes blink{50%{opacity:.55}}

/* cards */
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 30px;display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:linear-gradient(180deg,rgba(17,57,132,.28),rgba(12,26,51,.55));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px}
.k{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.v{font-family:var(--serif);font-size:38px;line-height:1;margin-top:12px;letter-spacing:-.01em}
.v em{font-style:italic;font-size:.6em;margin-left:4px;color:var(--muted)}
.s{font-size:13px;color:var(--muted);margin-top:8px}
.trend .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.trend svg{width:100%;height:120px;display:block;margin-top:14px}
.sline{fill:none;stroke:var(--orange2);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ga{stop-color:var(--orange)}
.grid{stroke:rgba(255,255,255,.08);stroke-width:1}
.empty{fill:var(--muted);font:13px var(--sans)}
footer{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-size:12px;padding:6px 0 26px}
footer img{height:13px;opacity:.7}

@media(min-width:900px){
  .hero{padding:52px 24px 60px}
  .stage{max-width:400px}
}
@media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)} .v{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body class="na">
<header class="bar">
  <span class="live" id="conn"><i></i><b id="connText">Connecting</b></span>
  <img class="logo" alt="Disrupt.com" src="data:image/png;base64,{{LOGO}}">
  <span class="now num" id="now"></span>
</header>

<section class="hero">
  <div class="eyebrow">Live water monitor</div>
  <h1><span id="name">Water Tank</span><br><em>Water level</em></h1>

  <div class="alert" role="alert"><div><span class="l">LOW WATER</span><span class="r">Only <span id="alertPct">--%</span> left</span></div></div>

  <div class="stage">
    <div class="big num"><span id="pct">--</span><span class="pc">%</span></div>
    <svg class="tank" viewBox="0 0 300 330" aria-hidden="true">
      <defs>
        <clipPath id="clip"><rect x="50" y="20" width="200" height="300" rx="4"/></clipPath>
        <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="g0"/><stop offset=".32" class="g1"/><stop offset=".62" class="g2"/><stop offset="1" class="g3"/>
        </linearGradient>
        <radialGradient id="hl" cx=".5" cy=".55" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="wa"/><stop offset="1" class="wb"/></linearGradient>
      </defs>
      <g class="mono">
        <rect x="50" y="20" width="200" height="300" rx="4" fill="url(#mg)"/>
        <rect x="50" y="20" width="200" height="300" rx="4" fill="url(#hl)"/>
      </g>
      <g clip-path="url(#clip)">
        <g id="lvl" class="lvl" style="transform:translateY(320px)">
          <g transform="translate(-40,-7)"><g class="w2"><path fill="#5b85ff" opacity=".55" d="M-180 0Q-150-9-120 0T-60 0T0 0T60 0T120 0T180 0T240 0T300 0T360 0T420 0V340H-180Z"/></g></g>
          <g class="w1"><path fill="url(#wg)" d="M-180 0Q-150-9-120 0T-60 0T0 0T60 0T120 0T180 0T240 0T300 0T360 0T420 0V340H-180Z"/></g>
          <circle class="bub" cx="95" cy="260" r="3" style="animation-delay:0s"/>
          <circle class="bub" cx="150" cy="275" r="2.2" style="animation-delay:1.6s"/>
          <circle class="bub" cx="205" cy="262" r="3.4" style="animation-delay:3.1s"/>
          <circle class="bub" cx="125" cy="280" r="2" style="animation-delay:4.2s"/>
        </g>
      </g>
      <g id="ticks"></g>
    </svg>
  </div>

  <div class="split num"><span class="l" id="ftline">-- ft of -- ft</span><span class="r" id="pill">Connecting</span></div>
  <br>
  <button class="cta" id="cta" type="button" aria-label="Refresh now">
    <span><small>Last update</small><b id="ago">Waiting…</b></span>
    <i><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></i>
  </button>
</section>

<div class="wrap">
  <section class="stats">
    <div class="card"><div class="k">Water height</div><div class="v num" id="hft">--</div><div class="s" id="hcm">&nbsp;</div></div>
    <div class="card"><div class="k" id="volK">Tank depth</div><div class="v num" id="vol">--</div><div class="s" id="volS">&nbsp;</div></div>
    <div class="card"><div class="k">Sensor to water</div><div class="v num" id="dist">--</div><div class="s" id="sens">&nbsp;</div></div>
    <div class="card"><div class="k">Updated at</div><div class="v num" id="clock">--</div><div class="s">Every 2 seconds</div></div>
  </section>

  <section class="card trend">
    <div class="top"><div class="k">Last 60 minutes</div><div class="s num" id="range"></div></div>
    <svg viewBox="0 0 300 100" preserveAspectRatio="none">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ga" stop-opacity=".4"/><stop offset="1" class="ga" stop-opacity="0"/></linearGradient></defs>
      <line class="grid" x1="0" x2="300" y1="10" y2="10"/><line class="grid" x1="0" x2="300" y1="50" y2="50"/><line class="grid" x1="0" x2="300" y1="90" y2="90"/>
      <path id="area" fill="url(#ag)"/><path id="sline" class="sline" vector-effect="non-scaling-stroke"/>
      <text id="empty" class="empty" x="150" y="55" text-anchor="middle">Collecting data…</text>
    </svg>
  </section>
</div>
<footer><img alt="" src="data:image/png;base64,{{LOGO}}"><span>Tank monitor</span></footer>

<script>
const $ = id => document.getElementById(id);
const FT = 30.48, TOP = 20, H = 300;
let shown = 0, lastOk = 0, fails = 0, ticksDone = false, timer = 0;

function countTo(to) {
  const from = shown, t0 = performance.now();
  cancelAnimationFrame(countTo.raf);
  const step = t => {
    const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3);
    $('pct').textContent = Math.round(from + (to - from) * e);
    if (k < 1) countTo.raf = requestAnimationFrame(step);
  };
  countTo.raf = requestAnimationFrame(step);
  shown = to;
}

// Foot scale right of the tank, plus the dashed MAX line inside it
function drawTicks(depthCm, maxCm) {
  const ns = 'http://www.w3.org/2000/svg', g = $('ticks');
  const y = cm => TOP + H - H * cm / depthCm;
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text) e.textContent = text;
    g.appendChild(e);
  };
  for (let f = 0; f * FT <= depthCm + 0.5; f++) {
    el('line', {class: 'tick', x1: 256, x2: 266, y1: y(f * FT), y2: y(f * FT)});
    el('text', {class: 'tlabel', x: 271, y: y(f * FT) + 4}, f + ' ft');
  }
  el('line', {class: 'maxline', x1: 50, x2: 250, y1: y(maxCm), y2: y(maxCm)});
  el('text', {class: 'maxlabel', x: 60, y: y(maxCm) - 7}, 'MAX ' + (maxCm / FT).toFixed(1) + ' FT');
}

function drawTrend(hist) {
  const pts = [], n = 60, dx = 300 / (n - 1), off = n - hist.length;
  hist.forEach((v, i) => { if (v >= 0) pts.push([(off + i) * dx, 90 - v * 0.8]); });
  $('empty').style.display = pts.length > 1 ? 'none' : '';
  if (pts.length < 2) { $('sline').setAttribute('d', ''); $('area').setAttribute('d', ''); $('range').textContent = ''; return; }
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  $('sline').setAttribute('d', line);
  $('area').setAttribute('d', line + 'L' + pts[pts.length - 1][0].toFixed(1) + ' 100L' + pts[0][0].toFixed(1) + ' 100Z');
  const vals = hist.filter(v => v >= 0);
  $('range').textContent = 'Low ' + Math.min(...vals) + '%  ·  High ' + Math.max(...vals) + '%';
}

function setState(cls, text) {
  document.body.className = cls;
  $('pill').textContent = text;
}

function render(d) {
  document.title = d.name + ' · ' + (d.ok ? d.pct + '%' : '--');
  $('name').textContent = d.name;
  if (!ticksDone) { drawTicks(d.depthCm, d.maxCm); ticksDone = true; }
  drawTrend(d.hist || []);
  const maxFt = (d.maxCm / FT).toFixed(1);

  if (d.cap > 0) {
    $('volK').textContent = 'Water in tank';
    $('vol').innerHTML = Math.round(d.cap * d.pct / 100).toLocaleString() + '<em>L</em>';
    $('volS').textContent = 'of ' + Math.round(d.cap).toLocaleString() + ' L';
  } else {
    $('vol').innerHTML = (d.depthCm / FT).toFixed(1) + '<em>ft</em>';
    $('volS').textContent = 'Max water ' + maxFt + ' ft';
  }

  if (!d.ok) {
    setState('na', 'Check sensor');
    $('pct').textContent = '--';
    $('ftline').textContent = '-- ft of ' + maxFt + ' ft';
    $('hft').textContent = '--'; $('hcm').innerHTML = '&nbsp;';
    $('dist').textContent = '--'; $('sens').textContent = 'No echo from sensor';
    return;
  }
  lastOk = Date.now();
  countTo(d.pct);
  $('lvl').style.transform = 'translateY(' + (TOP + H - H * Math.min(1, d.waterCm / d.depthCm)).toFixed(1) + 'px)';
  $('ftline').textContent = (d.waterCm / FT).toFixed(2) + ' ft of ' + maxFt + ' ft';
  $('hft').innerHTML = (d.waterCm / FT).toFixed(2) + '<em>ft</em>';
  $('hcm').textContent = Math.round(d.waterCm) + ' cm';
  $('dist').innerHTML = Math.round(d.distCm) + '<em>cm</em>';
  $('sens').textContent = 'Sensor online';
  $('alertPct').textContent = d.pct + '%';
  if (d.pct < d.low) setState('low', 'Low water');
  else if (d.pct < 50) setState('mid', 'Half full');
  else setState('ok', 'Good level');
}

function tickClock() {
  const now = new Date();
  $('now').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  if (lastOk) {
    const s = Math.round((Date.now() - lastOk) / 1000);
    $('ago').textContent = s < 3 ? 'Just now' : s < 60 ? s + ' seconds ago' : Math.floor(s / 60) + ' min ago';
    $('clock').textContent = new Date(lastOk).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});
  }
}

async function poll() {
  clearTimeout(timer);
  try {
    const r = await fetch('/data', {cache: 'no-store'});
    render(await r.json());
    fails = 0;
    $('conn').classList.remove('off');
    $('connText').textContent = 'Live';
  } catch (e) {
    if (++fails >= 3) { $('conn').classList.add('off'); $('connText').textContent = 'Offline'; }
  }
  timer = setTimeout(poll, 2000);
}

$('cta').onclick = () => {
  const c = $('cta');
  c.classList.remove('spin'); void c.offsetWidth; c.classList.add('spin');
  poll();
};
setInterval(tickClock, 1000);
tickClock();
poll();
</script>
</body></html>
