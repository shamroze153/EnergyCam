function rich(parts, x, y, font) { g.font = font; let cx = x; for (const [s, c] of parts) { g.fillStyle = c; g.fillText(s, cx, y); cx += g.measureText(s).width } return cx - x }
function logoMark(x, y, s, a = 1) { g.save(); g.globalAlpha *= a; const gr = g.createLinearGradient(x, y, x + s, y + s); gr.addColorStop(0, '#5ff0ae'); gr.addColorStop(1, '#2fbf7f'); rr(x, y, s, s, s * .24); g.fillStyle = gr; g.fill();
  g.strokeStyle = C.dark; g.lineWidth = s * .12; g.lineJoin = 'round'; g.lineCap = 'round'; g.beginPath(); g.moveTo(x + s * .25, y + s * .74); g.lineTo(x + s * .25, y + s * .28); g.lineTo(x + s * .5, y + s * .52); g.lineTo(x + s * .75, y + s * .28); g.lineTo(x + s * .75, y + s * .74); g.stroke();
  g.fillStyle = C.dark; g.fillRect(x + s * .44, y + s * .64, s * .12, s * .12); g.restore() }
function brand(a = 1) { g.save(); g.globalAlpha = a; logoMark(48, 40, 50); rich([['Mimar ', C.text], ['AI', C.green]], 112, 76, "700 32px Archivo"); g.restore() }
const proj = v => { const p = v.clone().project(camera); return p.z > 1 ? null : [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H] };

const TXT = [
  { tags: [['PDF → 3D', 1], ['DIGITAL TWINS', 0]], l1: [['Your floor plan PDF,', C.text]], l2: [['now walkable in 3D.', C.green]], sub: 'We turn flat drawings into a 3D building you can walk through, search and manage.', nav: -1 },
  { tags: [['01 · READ THE PDF', 1], ['THE INPUT', 0]], l1: [['AI reads every wall,', C.text]], l2: [['door and room.', C.green]], sub: 'Scanned drawings, CAD exports, even phone photos of old plans.', nav: 0 },
  { tags: [['02 · BUILD IN 3D', 1], ['TRUE SCALE', 0]], l1: [['Flat lines become', C.text]], l2: [['a real building.', C.green]], sub: 'Walls, doors and windows rebuilt at true scale, then furnished room by room.', nav: 1 },
  { tags: [['03 · WALK INSIDE', 1], ['CLICKABLE', 0]], l1: [['Walk through it.', C.text]], l2: [['Click ', C.text], ['any asset.', C.green]], sub: 'Every AC, DB panel and extinguisher opens its own live record.', nav: 2 },
  { tags: [['04 · TAG ASSETS', 1], ['ASSET REGISTER', 0]], l1: [['Every asset,', C.text]], l2: [['pinned in place.', C.green]], sub: 'Service dates, status and work orders, finally on a map.', nav: 3 }];
const NAV = ['Read PDF', 'Build 3D', 'Walk inside', 'Tag assets'];
function wrap(text, maxW) { const words = text.split(' '); const lines = []; let cur = ''; for (const w of words) { const t2 = cur ? cur + ' ' + w : w; if (g.measureText(t2).width > maxW && cur) { lines.push(cur); cur = w } else cur = t2 } lines.push(cur); return lines }

function textBlock(t) {
  { const ts = g.createLinearGradient(0, 0, 0, 260); ts.addColorStop(0, 'rgba(18,28,25,0.55)'); ts.addColorStop(1, 'rgba(18,28,25,0)'); g.fillStyle = ts; g.fillRect(0, 0, W, 260) }
  // bottom scrim
  const sy = WIDE ? H * .45 : 780; const scrim = g.createLinearGradient(0, sy, 0, H); scrim.addColorStop(0, 'rgba(18,28,25,0)'); scrim.addColorStop(.35, 'rgba(18,28,25,0.72)'); scrim.addColorStop(1, 'rgba(14,22,19,0.94)');
  const scrA = 1 - prog(t, 34.6, 35.2); if (WIDE) { const sc2 = g.createLinearGradient(0, 0, W * .55, 0); sc2.addColorStop(0, 'rgba(18,28,25,0.55)'); sc2.addColorStop(1, 'rgba(18,28,25,0)'); g.globalAlpha = scrA; g.fillStyle = sc2; g.fillRect(0, sy, W, H - sy) }
  g.globalAlpha = scrA; g.fillStyle = scrim; g.fillRect(0, sy, W, H - sy); g.globalAlpha = 1;
  const i = S.findIndex((s, k) => t >= s && t < S[k + 1]); if (i < 0 || i > 4) return; const T = TXT[i], L = t - S[i], out = 1 - prog(t, S[i + 1] - .35, S[i + 1]);
  const A = d => easeOut(prog(L, d, d + .55)) * out, Y = d => (1 - easeOut(prog(L, d, d + .55))) * 26;

  const hf = `700 ${HEADPX}px Archivo`;
  g.save(); g.globalAlpha = A(.15); rich(T.l1, 46, top + 42 + hl + Y(.15), hf); g.restore();
  g.save(); g.globalAlpha = A(.28); rich(T.l2, 46, top + 42 + hl * 2 + Y(.28), hf); g.restore();
  g.save(); g.globalAlpha = A(.5); g.font = "400 29px Archivo"; g.fillStyle = C.muted; wrap(T.sub, WIDE ? 760 : 960).forEach((ln, k) => g.fillText(ln, 48, top + 42 + hl * 2 + 56 + k * 40 + Y(.5))); g.restore();

}

function statusCard(t) {

  const w = 380, x = W - 48 - w, y = 36; let h = 168;
  let kicker, big, sub, map = false;
  if (i === 0) { const n = sheets.filter(s => t > s.land).length; kicker = 'YOUR DRAWINGS'; big = n ? `${n} PDF${n > 1 ? 's' : ''}` : 'Uploading…'; sub = 'Plan · elevation · lighting' }
  if (i === 1) { const done = t > 10.0; const n = ROOMS.filter(r => !r.hide && t > scanT((r.r[0] + r.r[2]) / 2)).length; kicker = 'PLAN READER'; big = done ? '10 rooms' : t > 7.4 ? `${n} rooms…` : 'Reading…'; sub = done ? '10 doors · 15 windows · 336 m²' : 'Tracing walls from A-102' }

  if (i === 3) { const p = setScene.pose || { x: 3.5, y: -3.5, yaw: 90 }; kicker = 'WALK MODE'; const rn = t < WALK0 ? 'Entrance' : roomAt(p.x, p.y); big = rn.charAt(0) + rn.slice(1).toLowerCase().replace('opd', 'OPD'); if (rn === 'OPD 2') big = 'OPD 2'; if (rn === 'Entrance') big = 'Entrance'; sub = ''; map = true; h = 330 }
  if (i === 4) { const n = ASSETS.filter((q, k) => t > PIN_T(k)).length; kicker = 'ASSET REGISTER'; big = `${n} assets`; sub = '6 AC · 2 FE · 1 DB · 1 CCTV' }
  g.save(); g.globalAlpha = a; rr(x, y, w, h, 16); g.fillStyle = 'rgba(19,30,27,0.82)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 1.5; g.stroke();
  g.font = MONO(16); g.letterSpacing = '2px'; g.fillStyle = C.muted; g.fillText(kicker, x + 22, y + 36); g.letterSpacing = '0px';

  if (!map) { g.strokeStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.moveTo(x + 22, y + 138); g.lineTo(x + w - 22, y + 138); g.stroke(); g.font = MONO(13); g.letterSpacing = '2px'; g.fillStyle = '#7f918a'; g.fillText('ILLUSTRATIVE SCENE', x + 22, y + 157); g.letterSpacing = '0px' }
  else { const p = setScene.pose || { x: 3.5, y: -3.5, yaw: 90 }; const s = 13.6, mx = x + 26, my = y + 112, mh = BD_ * s; const Mp = (X, Y) => [mx + X * s, my + mh - Y * s];
    g.strokeStyle = rgba(C.wire, .85); g.lineWidth = 2; g.beginPath(); for (const [x1, y1, x2, y2] of RUNS) { g.moveTo(...Mp(x1, y1)); g.lineTo(...Mp(x2, y2)) } g.stroke();
    const pp = Mp(t < WALK0 ? 3.5 : p.x, t < WALK0 ? -1 : p.y); const yr = (t < WALK0 ? 90 : p.yaw) * D; g.beginPath(); g.moveTo(...pp); g.arc(pp[0], pp[1], 40, -yr - .5, -yr + .5); g.closePath(); g.fillStyle = rgba(C.green, .28); g.fill();
    g.beginPath(); g.arc(pp[0], pp[1], 6, 0, 7); g.fillStyle = C.green; g.fill(); g.beginPath(); g.arc(pp[0], pp[1], 10 + (t * 1.5 % 1) * 10, 0, 7); g.strokeStyle = rgba(C.green, 1 - (t * 1.5 % 1)); g.stroke() }
  g.restore();
}
const BD_ = 14;

function cursor(x, y, press) { g.save(); g.translate(x, y); g.scale(1.6 - press * .15, 1.6 - press * .15); g.beginPath();
  [[0, 0], [0, 22], [6, 16.5], [10, 25], [13.5, 23.5], [9.6, 15.4], [17, 15.4]].forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.closePath();
  g.shadowColor = 'rgba(0,0,0,0.4)'; g.shadowBlur = 6; g.fillStyle = '#fff'; g.fill(); g.shadowBlur = 0; g.strokeStyle = '#0b1310'; g.lineWidth = 1.4; g.stroke(); g.restore() }
function infoPanel(a) { if (a <= 0) return; const w = 360, h = 400, x = W - 48 - w + (1 - easeOut(a)) * 40, y = WIDE ? 150 : 400; g.save(); g.globalAlpha = easeOut(a);
  rr(x, y, w, h, 18); g.fillStyle = 'rgba(15,25,22,0.93)'; g.fill(); g.strokeStyle = rgba(C.green, .8); g.lineWidth = 2; g.stroke();
  g.font = MONO(30); g.fillStyle = C.green; g.fillText('AC-07', x + 26, y + 52); g.font = "600 23px Archivo"; g.fillStyle = C.text; g.fillText('Split AC · 2.0 Ton', x + 26, y + 88);
  const rows = [['ROOM', 'OPD 2'], ['STATUS', '● Running'], ['LAST SERVICE', '12 Sep 2026'], ['NEXT DUE', '12 Dec 2026'], ['kWh TODAY', '14.2']];
  rows.forEach(([k, v], i) => { const yy = y + 136 + i * 42; g.font = MONO(16); g.fillStyle = C.muted; g.fillText(k, x + 26, yy); g.font = "600 21px Archivo"; g.fillStyle = k === 'STATUS' ? C.green : C.text; g.textAlign = 'right'; g.fillText(v, x + w - 26, yy); g.textAlign = 'left';
    g.strokeStyle = 'rgba(255,255,255,0.07)'; g.beginPath(); g.moveTo(x + 26, yy + 15); g.lineTo(x + w - 26, yy + 15); g.stroke() });
  rr(x + 26, y + h - 70, w - 52, 48, 24); g.fillStyle = C.green; g.fill(); g.font = MONO(18); g.fillStyle = C.dark; g.textAlign = 'center'; g.fillText('OPEN WORK ORDER  →', x + w / 2, y + h - 40); g.textAlign = 'left'; g.restore() }

function pins(t, alphaFor, labelFor) { for (const a of ASSETS) { const A = alphaFor(a); if (A <= 0) continue; const b = proj(a.top), tp = proj(a.top.clone().add(V(0, 2.2, 0))); if (!b || !tp) continue; const col = AK[a.k];
  g.save(); g.globalAlpha = A; g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(...b); g.lineTo(tp[0], tp[1]); g.stroke();
  const pr = (t * 1.1 + a.b[0] * .13) % 1; g.beginPath(); g.arc(tp[0], tp[1], 8 + pr * 18, 0, 7); g.strokeStyle = rgba(col, (1 - pr) * .8); g.stroke();
  g.beginPath(); g.arc(tp[0], tp[1], 8 * easeOut(A), 0, 7); g.fillStyle = col; g.fill(); g.lineWidth = 2.5; g.strokeStyle = '#fff'; g.stroke();
  if (labelFor(a)) label(tp[0] + 14, tp[1] - 18, a.id, col, 17); g.restore() } }

function overlay(t) {
  // scene-2 room labels
  if (t > 7.4 && t < 13.6) ROOMS.forEach(r => { if (r.hide) return; const cx = (r.r[0] + r.r[2]) / 2, cy = (r.r[1] + r.r[3]) / 2; const a = easeOut(prog(t, scanT(cx), scanT(cx) + .35)) * (1 - prog(t, 13.0, 13.6)); if (a <= 0) return;
    const p = proj(wp(cx, cy, .1)); if (!p) return; g.save(); g.globalAlpha = a; g.font = MONO(17); g.letterSpacing = '1.5px'; const w = g.measureText(r.n).width + 24; g.letterSpacing = '0px'; label(p[0] - w / 2, p[1] - 17 + (1 - a) * 12, r.n, C.green, 17); g.restore() });
  // scene-3 dimension callout
  if (t > 15.2 && t < 20) { const a = easeOut(prog(t, 15.2, 15.7)) * (1 - prog(t, 19.6, 20)); const p = proj(wp(12, -0.2, 3.2)); if (p) { g.save(); g.globalAlpha = a; g.font = MONO(17); g.letterSpacing = '1.5px'; const lw = g.measureText('24.0 × 14.0 m · 3.0 m').width + 24; g.letterSpacing = '0px'; label(p[0] - lw / 2, p[1] - 50, '24.0 × 14.0 m · 3.0 m', C.amber, 17); g.restore() } }
  // walk: door signs

    g.globalAlpha = clamp((12 - d) / 3) * prog(t, WALK0 + 1, WALK0 + 1.5) * (1 - prog(t, WALK0 + 4.0, WALK0 + 4.4)); const fs = clamp(60 / d, 12, 22); g.font = MONO(fs); g.letterSpacing = '1.5px'; const w = g.measureText(rm).width + 24; g.letterSpacing = '0px'; label(p[0] - w / 2, p[1] - fs * 1.9, rm, C.green, fs) } g.restore() }
  if (t > 20 && t < 30) {
    const L = t; pins(t, a => a.key ? prog(L, 26.2, 26.7) * (1 - prog(L, 29.6, 30)) : 0, () => false);
    const ac = ASSETS.find(a => a.key); const tp = proj(ac.mid); const cu = prog(L, 26.0, 27.0);
    if (cu > 0 && tp) { const e = ease(cu); const sx = lerp(W - 140, tp[0] - 4, e), sy = lerp(WIDE ? H - 200 : 820, tp[1] - 2, e);
      const clk = prog(L, CLICK, CLICK + .6); if (clk > 0 && clk < 1) { g.beginPath(); g.arc(tp[0], tp[1], 12 + clk * 56, 0, 7); g.strokeStyle = rgba(C.green, 1 - clk); g.lineWidth = 3; g.stroke() }
      g.save(); g.globalAlpha = 1 - prog(L, 29.2, 29.6); cursor(sx, sy, L > CLICK - .05 && L < CLICK + .2 ? 1 : 0); g.restore() }
    infoPanel(prog(L, CLICK + .15, CLICK + .6) * (1 - prog(L, 29.5, 29.9)));
  }
  if (t > 30 && t < 35) pins(t, a => easeOut(prog(t, PIN_T(ASSETS.indexOf(a)), PIN_T(ASSETS.indexOf(a)) + .3)) * (1 - prog(t, 34.6, 35)), a => ['AC-07', 'FE-03', 'DB-02', 'CAM-04', 'AC-05', 'FE-04'].includes(a.id));
  statusCard(t); textBlock(t); brand(1 - prog(t, 34.8, 35.3) + prog(t, 99, 100));
  if (t >= 35) outro(t - 35);
}
function outro(L) {
  const dim = easeOut(prog(L, 0, .8)); g.fillStyle = `rgba(16,26,23,${.74 * dim})`; g.fillRect(0, 0, W, H);
  const A = d => easeOut(prog(L, d, d + .6)), Y = d => (1 - A(d)) * 24; const cx = W / 2; const base = WIDE ? 170 : 330;
  g.save(); g.textAlign = 'left';
  g.globalAlpha = A(.15); const s = 116 * (0.85 + .15 * easeBack(prog(L, .15, .75))); logoMark(cx - s / 2, base - s / 2 + Y(.15), s);
  g.globalAlpha = A(.3); g.font = "700 84px Archivo"; const w1 = g.measureText('Mimar ').width + g.measureText('AI').width; rich([['Mimar ', C.text], ['AI', C.green]], cx - w1 / 2, base + 140 + Y(.3), "700 84px Archivo");
  const hf = `700 ${WIDE ? 58 : 62}px Archivo`; g.font = hf;
  g.globalAlpha = A(.6); let w2 = g.measureText('Send us a PDF plan.').width; rich([['Send us a PDF plan.', C.text]], cx - w2 / 2, base + 270 + Y(.6), hf);
  g.globalAlpha = A(.75); w2 = g.measureText('Walk it in 3D.').width; rich([['Walk it in ', C.text], ['3D.', C.green]], cx - w2 / 2, base + 345 + Y(.75), hf);
  g.globalAlpha = A(.95); g.font = "400 30px Archivo"; g.fillStyle = C.muted; g.textAlign = 'center'; g.fillText('Delivered as a link. Opens in any browser.', cx, base + 410 + Y(.95));
  g.globalAlpha = A(1.2); g.textAlign = 'left'; chip(cx, base + 450 + Y(1.2), '#AIforBuildings', { center: 1, bg: C.green, fg: C.dark, fs: 24, h: 56, px: 22 });
  g.globalAlpha = A(1.5); g.font = "400 24px Archivo"; g.fillStyle = '#8fa29b'; g.textAlign = 'center'; g.fillText('Founded by a facility engineer in Karachi.', cx, (WIDE ? H - 60 : H - 90) + Y(1.5));
  g.restore() }

// ================= render =================
function render(t) {
  setScene(t); composer.render();
  g.clearRect(0, 0, W, H); g.drawImage(gl, 0, 0); overlay(t);
  const fi = 1 - prog(t, 0, .4), fo = prog(t, DUR - .6, DUR); if (fi > 0 || fo > 0) { g.fillStyle = `rgba(14,22,19,${Math.max(fi, fo)})`; g.fillRect(0, 0, W, H) }
}
window.render = render; window.DUR = DUR; window.FPS = FPS; window.CUES = CUES;
window.frame = (t, q = .92) => { render(t); return out.toDataURL('image/jpeg', q).split(',')[1] };

</script></body></html>
