    zone: Unused
    recorder: xvr3
    channels: [6, 9, 12]
    ac: none
    empty_after_minutes: null
    note: >
      Marked blank during the survey: the channels stream, but there is
      nothing to see on them. Kept in the file rather than dropped, for two
      reasons. Every channel on a recorder is accounted for, so a gap in the
      numbering means somebody missed one rather than that one was ignored on
      purpose. And if a camera is ever pointed at something here, it starts
      reporting without anyone having to remember this file exists.

