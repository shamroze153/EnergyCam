  - name: 140-H Board Room
    floor: Ground floor
    # 7 Nov: this recorder's sub stream is 640x360, too small to read
    # a unit's display. Main stream for this room only.
    stream: main
    zone: H offices
    recorder: nvr1
    channels: [24]
    ac: hidden
    ac_tons: [2]   # survey 12 Nov: placed as GCR, the survey's 2 ton Kenwood 'pray area' entry (check)
    empty_after_minutes: 30
    # An empty orange-and-white chair reads as a person at 0.28 on this
    # camera (7 November, nobody in the room). A zone is the usual answer,
    # but a chair is the one false person that moves, so a box drawn round
    # today's chair would be pointing at carpet tomorrow. The room is
    # well lit and the table is close to the camera, so a real person here
    # scores far above this.
    conf: 0.40
    # 10 November, now that this camera serves 2560x1440: a face in a video
    # call on the wall TV was counted as a person in the room, at 0.69 --
    # well above the confidence above, so only a zone catches it. This is
    # the worst kind of false person for a meeting room: the meeting ends,
    # everybody leaves, the call is left running, and the room reports
    # itself occupied all evening and is never once flagged as empty.
    #
    # The box is the screen. A real person standing in front of the TV is
    # taller than it and reaches below it, so they are still counted --
    # measured at 0.20 and 0.45 overlap against this zone, both well under
    # the 0.8 that filters.
    ignore:
      24:
        - [570, 0, 1050, 275]   # the wall TV
    note: >
