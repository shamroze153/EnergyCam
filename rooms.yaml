    ac: none
    empty_after_minutes: null

  - name: Emergency Exit
    zone: H perimeter
    recorder: nvr1
    channels: [20]
    ac: none
    empty_after_minutes: null
    note: >
      No unit, so it never alerts on cooling. But a door that is supposed to
      stay shut, watched around the clock, is worth having the history of.

  - name: RO Plant
    zone: H perimeter
    recorder: nvr1
    channels: [19]
    ac: none
    empty_after_minutes: null

  - name: Genset Area
    zone: H perimeter
